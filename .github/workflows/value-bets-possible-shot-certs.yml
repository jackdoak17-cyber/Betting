name: Value Bets — Possible Shot Certs (Sportmonks/Bet365)

on:
  # Run after the odds job so props are fresh (odds job is at :07); this runs at :18 UTC
  schedule:
    - cron: "18 */6 * * *"
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Fetch Bet365 odds (Sportmonks pre-match — 9 leagues)"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: value-bets-possible-shot-certs
  cancel-in-progress: true

jobs:
  possible_shot_certs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No extra pip deps needed

      - name: Run possible shot certs
        env:
          MIN_DEC_PRICE: "1.30"   # keep lines priced >= 1.30
          TEAM_WIN_MAX:  "3.50"   # exclude teams with ML > 3.50
          POS_TAGS_OK:   "MID,FWD"
        run: |
          python scripts/value_bets/possible_shot_certs_sportmonks.py
          echo "----- OUTPUT (preview) -----"
          if [ -f data/value_bets/possible_shot_certs.txt ]; then
            tail -n 200 data/value_bets/possible_shot_certs.txt || true
          else
            echo "data/value_bets/possible_shot_certs.txt not found."
          fi

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/value_bets/possible_shot_certs.txt
          git commit -m "chore(value-bets): possible_shot_certs update $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes"
          git push
