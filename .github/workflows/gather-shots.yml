name: Gather shots (last-10 per player)

on:
  schedule:
    - cron: "20 6 * * 1"    # Mondays 06:20 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Gather shots
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          python scripts/gather_shots.py

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats/shots
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(shots): last-10 series $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
