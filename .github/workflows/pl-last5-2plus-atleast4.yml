name: Post — PL Last-5 ≥4/5 at 2+ (Shots, Fouls, Fouls Drawn)

on:
  workflow_dispatch:
  schedule:
    - cron: "5 7 * * *"  # daily 07:05 UTC

permissions:
  contents: write

concurrency:
  group: pl-last5-2plus-atleast4
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (default branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect script path (.py or .pypy)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/posts/pl_last5_2plus_atleast4.py ]; then
            echo "script=scripts/posts/pl_last5_2plus_atleast4.py" >> $GITHUB_OUTPUT
          elif [ -f scripts/posts/pl_last5_2plus_atleast4.pypy ]; then
            echo "script=scripts/posts/pl_last5_2plus_atleast4.pypy" >> $GITHUB_OUTPUT
          else
            echo "::error::pl_last5_2plus_atleast4 script not found (.py or .pypy)."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate post
        env:
          OUTPUT_PATH: posts/pl_last5_2plus_atleast4.md
          LEAGUE_ID: "8"
          MIN_MINUTES: "45"
        run: |
          set -euo pipefail
          python "${{ steps.detect.outputs.script }}"
          echo "----- posts/pl_last5_2plus_atleast4.md (head) -----"
          head -n 80 posts/pl_last5_2plus_atleast4.md || true
          echo "---------------------------------------------------"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/pl_last5_2plus_atleast4.md
          git diff --staged --quiet || git commit -m "Update: PL last-5 ≥4/5 at 2+ (Shots, Fouls, Fouls Drawn) [skip ci]"
          git push
