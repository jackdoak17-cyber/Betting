name: Post — PL Last-5 ≥4/5 at 2+ (Shots, Fouls, Fouls Drawn)

on:
  workflow_dispatch:
  schedule:
    # Daily at 07:05 UTC (staggered after your 07:00 job)
    - cron: "5 7 * * *"

permissions:
  contents: write

concurrency:
  group: pl-last5-2plus-atleast4
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Script uses only stdlib
      - name: Generate PL last-5 ≥4/5 at 2+ post
        env:
          OUTPUT_PATH: posts/pl_last5_2plus_atleast4.md
          LEAGUE_ID: "8"          # Premier League
          MIN_MINUTES: "45"       # require ≥45' in ≥4 of the last 5
        run: python scripts/posts/pl_last5_2plus_atleast4.py

      - name: Show output (first 80 lines)
        run: |
          echo "----- posts/pl_last5_2plus_atleast4.md -----"
          head -n 80 posts/pl_last5_2plus_atleast4.md || true
          echo "-------------------------------------------"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/pl_last5_2plus_atleast4.md
          git diff --staged --quiet && echo "No changes to commit." || git commit -m "Update: PL last-5 ≥4/5 at 2+ (Shots, Fouls, Fouls Drawn) [skip ci]"
          git push
