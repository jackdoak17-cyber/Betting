name: Post — PL Last-5 ≥4/5 at 2+ (Shots, Fouls, Fouls Drawn)

on:
  workflow_dispatch:
  schedule:
    - cron: "5 7 * * *"  # daily 07:05 UTC

permissions:
  contents: write

concurrency:
  group: pl-last5-2plus-atleast4
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repo tree (top 300 entries)
        run: |
          echo "PWD=$(pwd)"
          find -L . -maxdepth 3 -type f | sort | sed -n '1,300p'

      - name: Verify script exists
        run: |
          set -euo pipefail
          test -f scripts/posts/pl_last5_2plus_atleast4.py || {
            echo "::error file=scripts/posts/pl_last5_2plus_atleast4.py::Script not found. Check filename and location."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python version
        run: python -V

      - name: Quick input files sanity (non-fatal)
        run: |
          for f in \
            data/player_shots/by_league/8.json \
            data/player_fouls/by_league/8.json \
            data/player_fouls_drawn/by_league/8.json \
            data/fixtures/by_league/8.json \
            data/fixtures/8.json
          do
            [ -f "$f" ] && echo "✔ Found $f" || echo "ℹ Missing (ok): $f"
          done

      - name: Generate PL last-5 ≥4/5 at 2+ post
        env:
          OUTPUT_PATH: posts/pl_last5_2plus_atleast4.md
          LEAGUE_ID: "8"
          MIN_MINUTES: "45"
        run: |
          set -euo pipefail
          python scripts/posts/pl_last5_2plus_atleast4.py
          echo "----- posts/pl_last5_2plus_atleast4.md (head) -----"
          head -n 80 posts/pl_last5_2plus_atleast4.md || true
          echo "---------------------------------------------------"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/pl_last5_2plus_atleast4.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update: PL last-5 ≥4/5 at 2+ (Shots, Fouls, Fouls Drawn) [skip ci]"
            git push
          fi
