name: Value Bets — Sportmonks (Bet365 ALL odds)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write   # needed to push the generated TXT back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify fixtures input
        run: |
          echo "Listing data/fixtures/..."
          ls -R data/fixtures || true

      - name: Dump ALL Bet365 odds to TXT
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          SM_MAX_FIXTURES: "800"
        run: |
          python "scripts/odds/odds sport monks/value_bets_shots_certs.py"

      - name: Commit TXT to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/value_bets/bet365_all_odds.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: add/update Bet365 ALL odds dump [skip ci]"
            git push
          fi

      - name: Upload TXT artifact (also handy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bet365-all-odds
          path: data/value_bets/bet365_all_odds.txt
