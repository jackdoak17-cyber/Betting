name: Value Bets — Sportmonks (Shots Certs)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Environment sanity
        run: |
          echo "Listing predicted XI inputs..."
          ls -R data/predicted_xi || true

      - name: Run Sportmonks Shots Certs
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          SM_BOOKMAKERS: "Kambi"
          SM_MIN_DECIMAL: "1.20"
          SM_INCLUDE_SHOTS: "1"
          SM_INCLUDE_SOT: "1"
        run: |
          python "scripts/odds/odds sport monks/value_bets_shots_certs.py"

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportmonks-shots-certs
          path: |
            reports/props_latest.csv
            reports/props_latest.json
            reports/digest_latest.md
            data/value_bets/sportmonks_shots_certs.txt
