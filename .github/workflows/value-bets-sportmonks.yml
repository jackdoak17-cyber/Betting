name: Value Bets — Sportmonks (Bet365 ALL odds)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: List predicted XI inputs
        run: |
          ls -R data/predicted_xi || true

      - name: Dump Bet365 ALL odds (TXT)
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          SM_MAX_FIXTURES: "500"
        run: |
          python "scripts/odds/odds sport monks/value_bets_shots_certs.py"

      - name: Upload TXT artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bet365-all-odds
          path: |
            data/value_bets/bet365_all_odds.txt
