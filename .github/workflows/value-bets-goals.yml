name: Value Bets — Goals (H2H)

on:
  workflow_dispatch:
  schedule:
    # every 4 hours (tweak if you want fewer runs to conserve minutes)
    - cron: "0 */4 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No external deps needed, but keep a pip upgrade fast + stable
      - name: Install deps (none strictly required)
        run: python -m pip install --upgrade pip

      - name: Generate goals value flags from H2H cache
        env:
          # Optional tuning knobs; defaults are sensible.
          VB_LASTN: "5"
          VB_MIN_SAMPLES: "3"
          VB_O25_MIN_RATE: "0.60"
          VB_BTTS_MIN_RATE: "0.60"
          VB_O35_MIN_RATE: "0.40"
          VB_U25_MAX_RATE: "0.20"
          VB_SOT_BOOST: "0.5"
          VB_SOT_SUPPRESS: "0.5"
          # VB_INCLUDE_LEAGUES: "8,9,82"   # uncomment to restrict
        run: |
          python scripts/value_bets/goals/goals_value_flags.py
          echo "---- summary preview ----"
          sed -n '1,120p' data/value_bets/goals/summary.txt || true

      - name: Commit & push outputs
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/value_bets/goals/by_league/*.json \
                  data/value_bets/goals/combined.json \
                  data/value_bets/goals/summary.txt || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(value-bets-goals): refresh flags from H2H cache"
            git push
          fi
