name: Value Bets — Goals (form + H2H gate)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"  # every 4 hours

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip

      - name: Generate value bets (form + H2H last-2 gate)
        env:
          MIN_PRICE: "1.30"
          MIN_GAMES: "6"
          THRESH_OVER25: "0.70"
          THRESH_BTTS: "0.70"
          THRESH_TEAM_O15: "0.70"
          WINDOW_DAYS: "7"            # set "0" to scan all future fixtures
          H2H_LAST2_REQUIRED: "1"     # set "0" to disable the last-2 gate
        run: |
          python scripts/value_bets/goals/goals_value_flags.py
          echo "---- summary preview ----"
          sed -n '1,160p' data/value_bets/goals_value_flags.txt || true

      - name: Commit & push outputs
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/value_bets/goals_value_flags.txt posts/value_bets_goals.md || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(value-bets-goals): refresh shortlist (form + H2H last-2 gate)"
            git push
          fi
