name: Value Bets — Goals (Over2.5, BTTS, Team O1.5)

on:
  schedule:
    - cron: "*/120 * * * *"  # every 30 minutes (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: value-bets-goals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Thresholds & filters (script reads these if present)
      OVER25_MIN: "0.70"        # Combined Over 2.5 minimum
      BTTS_MIN: "0.70"          # Combined BTTS minimum
      TEAM_OVER15_MIN: "0.70"   # Single-team Over 1.5 minimum
      MIN_DEC_PRICE: "1.80"     # Only flag when any qualifying market price >= this
      WINDOW_DAYS: "7"          # Look-ahead window for fixtures (days)
      # Optional: limit to specific leagues (CSV)
      # LEAGUE_IDS: "8,9,72,82,181,208,244,271,301,384,387,444,453,462,501,564,567,573,591,600"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # allow rebase before push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Build goals value flags (writes to data/value_bets/)
        run: |
          python scripts/value_bets/goals_value_flags.py

      - name: Show summary in logs
        run: |
          echo "----- goals_value_flags.txt (first 200 lines) -----"
          sed -n '1,200p' data/value_bets/goals_value_flags.txt || true
          echo "----- posts/value_bets_goals.md (first 120 lines, if present) -----"
          sed -n '1,120p' posts/value_bets_goals.md || true

      - name: Commit & push outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Always try to add the main value file; add post if it exists
          git add data/value_bets/goals_value_flags.txt || true
          [ -f posts/value_bets_goals.md ] && git add posts/value_bets_goals.md || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(value-bets): update goals flags $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH" || true
          git push origin HEAD:"$BRANCH"
