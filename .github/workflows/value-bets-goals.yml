name: Value Bets — Goals (Over2.5, BTTS, Team O1.5)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)

permissions:
  contents: write

concurrency:
  group: value-bets-goals
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Thresholds & settings (change here if you want)
      OVER25_MIN: "0.70"
      BTTS_MIN: "0.70"
      TEAM_OVER15_MIN: "0.70"
      MIN_DEC_PRICE: "1.80"
      WINDOW_DAYS: "7"
      LAST_N: "10"
      MIN_SAMPLES: "6"
      # Optionally restrict leagues:
      # LEAGUE_IDS: "8,9,72,82,181,208,244,271,301,384,387,444,453,462,501,564,567,573,591,600"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run goals value flags
        run: |
          python scripts/value_bets/goals/goals_value_flags.py

      - name: Commit & push output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add value-bets text outputs
          git add data/value_bets/*.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(value-bets-goals): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH" || true
          git push origin HEAD:"$BRANCH"
