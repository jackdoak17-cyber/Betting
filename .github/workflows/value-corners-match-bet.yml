name: Value — Corners Match Bet (Bet365)

on:
  schedule:
    # Daily at 07:40 UTC
    - cron: "40 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: value-corners-match-bet
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Leagues to scan (same set you used for winrates)
  LEAGUE_IDS: "301,384,387,564,567,600,8,82,9"
  WINDOW_DAYS: "7"
  MIN_MATCHES: "6"
  EDGE_MIN_WIN: "0.60"
  EDGE_MAX_WIN: "0.40"
  MIN_DEC_PRICE: "1.70"
  ENABLE_EV: "1"
  EV_MIN_EDGE: "0.03"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps (none needed)
        run: echo "No external dependencies required."

      - name: Generate corners match-bet candidates
        run: python scripts/value_bets/corners_match_bet.py

      - name: Show summary
        run: |
          echo "----- data/value_bets/corners_match_bet/corners_match_bet_summary.txt -----"
          sed -n '1,160p' data/value_bets/corners_match_bet/corners_match_bet_summary.txt || true
          echo "--------------------------------------------------------------------------------"

      - name: Commit & push (rebase-safe)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git config --global user.name  "${GIT_COMMITTER_NAME}"
          git config --global user.email "${GIT_COMMITTER_EMAIL}"

          git fetch origin main
          git checkout -B main origin/main

          git add -A data/value_bets/corners_match_bet/*.json \
                     data/value_bets/corners_match_bet/corners_match_bet_summary.txt || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "chore(value): corners match bet candidates ${ts}"

          for attempt in 1 2 3; do
            git rebase --abort || true
            git pull --rebase --autostash origin main || true
            if git push --force-with-lease origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt — retrying..."
            sleep 2
          done

          echo "Final attempt after fresh fetch..."
          git rebase --abort || true
          git fetch origin main
          git pull --rebase --autostash origin main || true
          git push --force-with-lease origin HEAD:main
