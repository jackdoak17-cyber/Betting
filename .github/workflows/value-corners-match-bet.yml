name: Value — Corners Match Bet (Bet365)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (tweak as you like)

permissions:
  contents: write

jobs:
  corners-match-bet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      # Optional tuning (set/adjust or remove if your script ignores them):
      LEAGUE_IDS: "301,384,387,564,567,600,8,82,9"
      MIN_DEC_PRICE: "1.70"
      MIN_DIFF: "0.15"
      WINDOW_DAYS: "7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run corners match bet
        run: |
          python scripts/value_bets/corners_match_bet.py

      - name: Commit & push report (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit only files your script may write:
          git add data/value_bets || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(value): update Corners Match Bet $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
