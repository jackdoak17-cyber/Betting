# .github/workflows/value-shots-and-sot.yml
name: Value — Shots & Shots on Target

on:
  schedule:
    - cron: "15 7 * * *"   # daily 07:15 UTC
  workflow_dispatch: {}

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  LEAGUE_IDS: "301,384,387,564,567,600,8,82,9"
  WINDOW_DAYS: "7"
  MIN_SIDE_RATE: "0.60"
  MIN_GAP: "0.15"
  FAVORITE_MAX_DECIMAL: "1.60"
  UNDERDOG_MAX_DECIMAL: "4.00"
  OUT_PATH: "data/value_bets/shots_and_sot_matchup.txt"

jobs:
  shots-sot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: ${{ env.PYTHON_VERSION }} }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Build picks
        run: python scripts/value_bets/shots_and_sot_matchup.py
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/value_bets/shots_and_sot_matchup.txt
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore(value): update Shots & SOT picks $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
