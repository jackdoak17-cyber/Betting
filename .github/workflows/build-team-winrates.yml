name: Build - Team Win Rates (Corners/Shots/SOT/Cards)

on:
  schedule:
    # Daily at 07:30 UTC
    - cron: "30 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: team-winrates
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Process ALL requested leagues
  LEAGUE_IDS: "301,384,387,564,567,600,8,82,9"
  LAST_N: "10"
  RED_WEIGHT: "1"          # set "2" if you want reds to count double
  OUT_DIR: "data/team_winrates"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps (none needed)
        run: echo "No external dependencies required."

      - name: Generate team win rates
        run: python scripts/team_win_rates.py

      - name: Show summary
        run: |
          echo "----- data/team_winrates/summary.txt -----"
          cat data/team_winrates/summary.txt || true
          echo "-----------------------------------------"

      - name: Commit & push (rebase-safe)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git config --global user.name  "${GIT_COMMITTER_NAME}"
          git config --global user.email "${GIT_COMMITTER_EMAIL}"

          # Base branch on latest remote main
          git fetch origin main
          git checkout -B main origin/main

          git add -A data/team_winrates/by_league/*.json data/team_winrates/summary.txt || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "chore(team-winrates): update ${ts}"

          # Rebase & push with a few retries
          for attempt in 1 2 3; do
            git rebase --abort || true
            git pull --rebase --autostash origin main || true
            if git push --force-with-lease origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt — retrying..."
            sleep 2
          done

          echo "Final attempt after fresh fetch..."
          git rebase --abort || true
          git fetch origin main
          git pull --rebase --autostash origin main || true
          git push --force-with-lease origin HEAD:main
