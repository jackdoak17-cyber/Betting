name: Build — Team Win Rates (Corners/Shots/SOT/Cards)

on:
  schedule:
    # Daily at 07:30 UTC
    - cron: "30 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: team-winrates
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Optional tunables for the script:
  LEAGUE_IDS: "8"                # or "8,564,82,384,301"
  LAST_N: "10"
  RED_WEIGHT: "1"                # set "2" if you prefer reds=2 cards
  OUT_DIR: "data/team_winrates"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps (none needed)
        run: python - <<'PY'
print("No external dependencies required.")
PY

      - name: Generate team win rates
        run: python scripts/team_win_rates.py

      - name: Show summary
        run: |
          echo "----- data/team_winrates/summary.txt -----"
          cat data/team_winrates/summary.txt || true
          echo "-----------------------------------------"

      - name: Commit & push
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git config --global user.name  "${GIT_COMMITTER_NAME}"
          git config --global user.email "${GIT_COMMITTER_EMAIL}"

          git add -A data/team_winrates/by_league/*.json data/team_winrates/summary.txt || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "chore(team-winrates): update ${ts}"
          git push
