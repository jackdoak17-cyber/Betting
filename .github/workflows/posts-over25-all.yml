name: Posts — Over 2.5 (All Leagues, Combined%)

on:
  schedule:
    - cron: "20 7 * * *"   # Daily at 07:20 UTC (after upstream builders)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: posts-over25-all
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          # No external libs needed for pure-local processing.

      - name: Generate Over 2.5 post (pure local)
        env:
          OUTPUT_PATH: posts/over25_all.md
          LAST_N: "10"
          MIN_GAMES: "6"
          TOP_K_PER_LEAGUE: "8"
          USE_HOME_AWAY: "0"   # set to "1" to use home-only + away-only rates
        run: |
          python scripts/posts/over25_matches.py
          echo "----- posts/over25_all.md (first 120 lines) -----"
          head -n 120 posts/over25_all.md || true
          echo "-------------------------------------------------"

      - name: Commit & push post
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/over25_all.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "post: Over 2.5 (All Leagues, Combined%)"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH" || true
          git push origin HEAD:"$BRANCH"
