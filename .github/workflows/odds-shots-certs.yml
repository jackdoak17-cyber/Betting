name: Find player shots 1+ certs

on:
  workflow_dispatch: {}
  schedule:
    - cron: "20 6 * * *"   # 06:20 UTC daily, after your fixtures job

permissions:
  contents: write

jobs:
  certs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run certs (Player Shots 1+)
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_MIN_PRICE: "1.30"
          ODDS_BOOKMAKERS: "bet365,kambi"
          ODDS_SOURCE: "auto"
        run: |
          python scripts/find_player_shot_certs.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player_shots/certs_shots1plus.json
          git commit -m "feat(certs): player shots 1+ $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes"
          git push
