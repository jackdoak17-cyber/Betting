name: Value Bets (PP + Unibet)

on:
  # run this automatically after the odds-fetch workflow finishes
  workflow_run:
    # ⚠️ This must match the *name* of your odds workflow as it appears in GitHub.
    # If you didn't set a name in that file, GitHub shows the filename.
    workflows: ["fetch-odds-pp-unibet"]
    types: [completed]

  # also run hourly
  schedule:
    - cron: "25 * * * *"

  # allow manual runs
  workflow_dispatch:
    inputs:
      leagues:
        description: "Override LEAGUE_IDS (comma-separated). Leave blank for defaults."
        required: false
        default: ""
      window_days:
        description: "SOT window (days)"
        required: false
        default: "7"

concurrency:
  group: value-bets-pp-unibet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  value-bets:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for committing results
    env:
      # tweak thresholds if you like; otherwise the script defaults match your b365 versions
      LEAGUE_IDS: ${{ github.event.inputs.leagues }}
      WINDOW_DAYS: ${{ github.event.inputs.window_days }}
      MIN_DEC_PRICE: "1.72"
      MIN_DEC_PRICE_05: "1.72"
      MIN_DEC_PRICE_15: "1.72"
      MIN_DEC_PRICE_SOT: "1.72"
      MIN_DEC_PRICE_CERTS: "1.30"
      TEAM_UNDERDOG_MAX: "3.50"
      TEAM_UNDERDOG_MAX_SOT: "3.50"
      TEAM_WIN_MAX: "3.50"
      UNDERDOG_MAX: "3.50"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # (No extra deps needed — the script uses stdlib only.)

      - name: Run value-bet finders (PP + Unibet)
        run: |
          set -euo pipefail

          python scripts/value_bets/pp_unibet_like_b365.py --mode shots_certs | tee data/value_bets/shots_certs_pp_unibet.txt
          python scripts/value_bets/pp_unibet_like_b365.py --mode singles_05  | tee data/value_bets/value_singles_pp_unibet.txt
          python scripts/value_bets/pp_unibet_like_b365.py --mode singles_15  | tee data/value_bets/value_singles_2plus_pp_unibet.txt
          python scripts/value_bets/pp_unibet_like_b365.py --mode singles_sot | tee data/value_bets/value_singles_sot_pp_unibet.txt

          echo
          echo "---- tail of shots_certs ----"
          tail -n 60 data/value_bets/shots_certs_pp_unibet.txt || true
          echo "---- tail of singles_05 ----"
          tail -n 60 data/value_bets/value_singles_pp_unibet.txt || true
          echo "---- tail of singles_15 ----"
          tail -n 60 data/value_bets/value_singles_2plus_pp_unibet.txt || true
          echo "---- tail of singles_sot ----"
          tail -n 60 data/value_bets/value_singles_sot_pp_unibet.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: value-bets-pp-unibet
          if-no-files-found: warn
          path: |
            data/value_bets/shots_certs_pp_unibet.txt
            data/value_bets/value_singles_pp_unibet.txt
            data/value_bets/value_singles_2plus_pp_unibet.txt
            data/value_bets/value_singles_sot_pp_unibet.txt

      - name: Commit value-bet outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "value-bets (PP+Unibet): update outputs [skip ci]"
          file_pattern: data/value_bets/*.txt
          add_options: "-A"
