name: Build player fouls

on:
  # Daily at 01:10 UTC
  schedule:
    - cron: "10 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: player-stats-fouls
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
  SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}

jobs:
  build-player-fouls:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Sanity check secret
        run: |
          if [ -z "${SPORTMONKS_TOKEN:-}" ]; then
            echo "ERROR: SPORTMONKS_TOKEN secret not available to job." >&2
            exit 1
          fi

      # ---------- Build fouls ----------
      - name: Build player fouls
        run: python scripts/player_fouls.py

      - name: Fouls coverage/summaries (if present)
        run: |
          [ -f scripts/check_player_fouls_coverage.py ] && python scripts/check_player_fouls_coverage.py || true
          [ -f scripts/render_player_fouls_summary.py ] && python scripts/render_player_fouls_summary.py || true

      # ---------- Commit & push ----------
      - name: Commit & push fouls data (robust rebase)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git config --global user.name  "${GIT_COMMITTER_NAME}"
          git config --global user.email "${GIT_COMMITTER_EMAIL}"

          git fetch origin main
          git checkout -B main origin/main

          git add -A data/player_fouls || true
          # Catch any other player_* outputs (harmless if unchanged)
          git add -A data/player_* || true

          if git diff --staged --quiet; then
            echo "No fouls data changes to commit."
            exit 0
          fi

          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "chore(player-fouls): update ${ts}"

          for attempt in 1 2 3; do
            git rebase --abort || true
            git pull --rebase --autostash origin main || true
            if git push --force-with-lease origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt — retrying..."
            sleep 2
          done

          echo "Final attempt after fresh fetch..."
          git rebase --abort || true
          git fetch origin main
          git pull --rebase --autostash origin main
          git push --force-with-lease origin HEAD:main
