# .github/workflows/criteria-odds.yml
name: Criteria odds flags (Bet365)
on:
  schedule: [ { cron: "15 8 * * 1" } ]  # after player-filters job
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip && pip install requests
      - name: Flag odds from criteria
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MIN_PRICE: "1.80"
        run: python scripts/flag_players_by_criteria_odds.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player_filters/criteria_odds_flags.txt
          git commit -m "feat(criteria-odds): refresh $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes"
          git push
