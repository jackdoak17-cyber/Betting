name: Player shots on target histories

on:
  schedule:
    - cron: "30 6 * * 1"   # Every Monday at 06:30 UTC (after predict_lineups)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-sot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: player-sot
      cancel-in-progress: false
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Build shots-on-target histories
        run: |
          python scripts/player_shots_on_target.py

      - name: Coverage & summaries
        run: |
          python scripts/check_player_sot_coverage.py
          python scripts/render_player_sot_summary.py

      - name: Commit & push SOT data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player_shots_on_target
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(player_sot): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
