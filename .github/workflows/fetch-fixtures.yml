name: Fetch fixtures (next 6 days)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"  # daily 06:15 UTC

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      SMONKS_CACHE_DIR: .cache_smonks
      DATA_DIR: data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SportMonks cache
        uses: actions/cache@v4
        with:
          path: .cache_smonks
          key: smonks-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            smonks-cache-${{ runner.os }}-

      - name: Fetch fixtures
        run: python scripts/fetch_fixtures.py

      - name: Upload fixtures.json
        uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: data/fixtures.json
