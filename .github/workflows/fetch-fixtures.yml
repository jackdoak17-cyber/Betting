name: Fetch fixtures

on:
  schedule:
    - cron: "0 6 * * 1"   # 06:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write   # required to push the updated JSON files

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # If you keep a repo requirements.txt, this will use it;
          # otherwise we install requests which this script needs.
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run fetcher
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          LEAGUE_IDS: "8,9,384,387,82,301,564,567,600"
          DAYS_AHEAD: "21"             # clamp to max 100 by the script
          OUT_DIR: "data/fixtures"
        run: python scripts/fetch_fixtures.py

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(fixtures): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
