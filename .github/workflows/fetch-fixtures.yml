name: Fetch fixtures (next 14 days)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days ahead"
        required: false
        default: "14"
      back:
        description: "Days back"
        required: false
        default: "0"
      leagues:
        description: "Comma list of league IDs (e.g. 8,9,564)"
        required: false
        default: "8,9,564"   # PL, Championship, La Liga for now

jobs:
  fixtures:
    runs-on: ubuntu-latest
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fixtures fetcher
        run: |
          python scripts/fetch_fixtures.py \
            --days "${{ inputs.days }}" \
            --back "${{ inputs.back }}" \
            --leagues "${{ inputs.leagues }}"

      - name: List outputs
        run: |
          echo "pwd=$(pwd)"
          ls -la
          echo "---- artifacts ----"
          ls -R artifacts || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: |
            artifacts/fixtures_window.json
            artifacts/fixtures_window.csv
            artifacts/debug/**
          if-no-files-found: warn
