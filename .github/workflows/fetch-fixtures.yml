name: Fetch fixtures (next 14 days)

on:
  workflow_dispatch:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fixtures fetcher
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          DAYS_AHEAD: '14'
        run: python scripts/fetch_fixtures.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: |
            data/fixtures_window.json
            data/fixtures_window.csv
            data/fixtures_by_day/*.json
