name: Fetch fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Map your existing repo secret to BOTH names so any script works
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DAYS_AHEAD: "21"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check required env vars
        run: |
          for v in SPORTMONKS_TOKEN SPORTMONKS_API_TOKEN ODDS_API_KEY; do
            if [ -z "${!v}" ]; then
              echo "Missing env var: $v"; exit 1
            fi
          done
          echo "All required env vars are present."

      - name: Run fetcher
        run: python scripts/fetch_fixtures.py

      - name: Commit results (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/fixtures
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(fixtures): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
