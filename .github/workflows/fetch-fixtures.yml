name: Fetch fixtures (Sportmonks only)

on:
  schedule:
    - cron: "5 6 * * *"   # every day 06:05 UTC (adjust as needed)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch_fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetcher
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          DAYS_AHEAD: "7"
        run: python scripts/fetch_fixtures.py

      - name: Commit & push fixture files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures
          git commit -m "chore(fixtures): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes"
          git push
