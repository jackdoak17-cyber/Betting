name: Fetch fixtures (next 14 days)

on:
  workflow_dispatch:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      DAYS_AHEAD: "14"          # change if you want
      # FILTER_LEAGUES: "8,9,564"   # leave unset to fetch ALL leagues
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fixtures fetcher
        run: python scripts/fetch_fixtures.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: |
            data/fixtures_window.json
            data/fixtures_window.csv
            data/fixtures_by_day/*.json
          if-no-files-found: warn
