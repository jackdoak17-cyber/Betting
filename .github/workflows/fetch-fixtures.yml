name: Fetch fixtures (next 14 days)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD). Leave empty for today"
        required: false
      end:
        description: "End date (YYYY-MM-DD). Leave empty for today+14"
        required: false

jobs:
  fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fixtures fetcher
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          SPORTMONKS_BASE_URL: https://api.sportmonks.com/v3
          FIXTURES_START: ${{ github.event.inputs.start }}
          FIXTURES_END: ${{ github.event.inputs.end }}
        run: |
          python scripts/fetch_fixtures.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: |
            data/fixtures_window.json
            data/fixtures_window.csv
