name: Fetch fixtures (Sportmonks only)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # Every Monday at 05:00 UTC

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetcher
        run: python scripts/fetch_fixtures.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures
          git commit -m "chore(fixtures): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes"
          git push
