name: Fetch fixtures (Sportmonks only)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # every Monday 05:00 UTC

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Repo secret required: SPORTMONKS_TOKEN
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      # Alias env in case the script expects this older name
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      DAYS_AHEAD: "21"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sanity check env vars
        run: |
          : "${SPORTMONKS_TOKEN:?Missing SPORTMONKS_TOKEN}"
          : "${SPORTMONKS_API_TOKEN:?Missing SPORTMONKS_API_TOKEN}"
          echo "Env looks good."

      - name: Run fetcher
        run: python scripts/fetch_fixtures.py

      - name: Commit results (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/fixtures || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(fixtures): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
