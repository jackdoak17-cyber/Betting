name: H2H Cache — SportMonks (daily)

on:
  workflow_dispatch:
  schedule:
    - cron: "55 7 * * *"  # 07:55 UTC daily

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip requests

      - name: Fetch H2H caches (from upcoming fixtures only)
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          H2H_CACHE_HOURS: "24"     # refresh threshold
          H2H_MATCHES: "5"          # last N to keep
          SM_SLEEP: "0.05"
          SM_TIMEOUT: "20"
        run: python scripts/h2h_last2_fetch.py

      - name: Commit & push only if H2H changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/h2h; then
            git add data/h2h
            git commit -m "chore(h2h): refresh head-to-head caches (N=${H2H_MATCHES})"
            git push
          else
            echo "No changes in data/h2h to commit."
          fi
