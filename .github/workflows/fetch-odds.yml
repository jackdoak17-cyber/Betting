name: Fetch Bet365 odds (Sportmonks pre-match)

on:
  schedule:
    # Every 6 hours at :07 (UTC) to avoid colliding with your fixtures job at :05
    - cron: "7 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch_odds_bet365:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests

      - name: Run Bet365 odds gatherer
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          # Optional overrides:
          # LEAGUE_IDS: "301,384,387,564,567,600,8,82,9"
          SM_BOOKMAKER_ID: "2"   # Bet365
          # SM_MARKETS: "1,2,12"  # (optional) restrict to certain market IDs
          SM_MAX_WORKERS: "6"    # tune if you hit 429s
          SM_PER_PAGE: "50"
          SM_TIMEOUT: "20"
          SM_RETRIES: "2"
        run: python scripts/odds_bet365_gather.py

      - name: Commit & push odds files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds/b365
          git commit -m "chore(odds-b365): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes"
          git push
