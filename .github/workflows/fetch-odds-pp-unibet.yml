name: Fetch odds — Paddy Power & Unibet (Sportmonks pre-match — 9 leagues)

on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: odds-pp-unibet
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        bookmaker:
          - { id: "19", dir: "paddypower", label: "Paddy Power" }
          - { id: "23", dir: "unibet",     label: "Unibet" }

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanity check secret
        run: |
          if [ -z "${{ secrets.SPORTMONKS_TOKEN }}" ]; then
            echo "ERROR: SPORTMONKS_TOKEN secret is missing." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests

      - name: Fetch odds — ${{ matrix.bookmaker.label }}
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          LEAGUE_IDS: "301,384,387,564,567,600,8,82,9"
          BOOKMAKER_ID: ${{ matrix.bookmaker.id }}
          BOOKMAKER_NAME: ${{ matrix.bookmaker.label }}
          OUT_DIR: data/odds/${{ matrix.bookmaker.dir }}
          SM_SLEEP: "0.05"
          SM_TIMEOUT: "20"
          DEBUG_BOOKMAKERS: "1"
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}/by_league" "${OUT_DIR}/fixtures"
          python scripts/fetch_odds.py
          echo "== Wrote files under ${OUT_DIR} =="
          find "${OUT_DIR}" -type f | sort

      - name: Commit & push odds files (robust rebase with lease)
        env:
          DEFAULT_BRANCH: main
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git config --global user.name  "${GIT_COMMITTER_NAME}"
          git config --global user.email "${GIT_COMMITTER_EMAIL}"
          git add -A "data/odds/${{ matrix.bookmaker.dir }}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "chore(odds-${{ matrix.bookmaker.dir }}): update ${ts}"
          for attempt in 1 2 3; do
            git fetch origin "${DEFAULT_BRANCH}"
            git pull --rebase --autostash origin "${DEFAULT_BRANCH}" || true
            if git push --force-with-lease origin HEAD:"${DEFAULT_BRANCH}"; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Push failed on attempt ${attempt} — retrying..."
            sleep 3
          done
          echo "Final attempt after a fresh fetch..."
          git fetch origin "${DEFAULT_BRANCH}"
          git pull --rebase --autostash origin "${DEFAULT_BRANCH}" || true
          git push --force-with-lease origin HEAD:"${DEFAULT_BRANCH}"
