# .github/workflows/fetch-odds-pp-unibet.yml
name: fetch-odds-pp-unibet

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { id: 19, slug: "pp",     name: "Paddy Power" }
          - { id: 23, slug: "unibet", name: "Unibet" }
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      # use your normal 9 leagues; override with workflow_dispatch inputs if you want
      LEAGUE_IDS: "301,384,387,564,567,600,8,82,9"
      SM_SLEEP: "0.05"
      SM_TIMEOUT: "20"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch script for ${{ matrix.name }}
        env:
          BOOKMAKER_ID:   ${{ matrix.id }}
          BOOKMAKER_SLUG: ${{ matrix.slug }}
          BOOKMAKER_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          echo "== Fetching odds for ${BOOKMAKER_NAME} (id=${BOOKMAKER_ID}, slug=${BOOKMAKER_SLUG}) =="
          python scripts/fetch_odds.py

          echo
          echo "== Tree of data/odds/${BOOKMAKER_SLUG} =="
          find data/odds/${BOOKMAKER_SLUG} -maxdepth 3 -type f | sort || true

          echo
          echo "== latest.json sample =="
          test -f data/odds/${BOOKMAKER_SLUG}/latest.json && jq -C '. | {generated_at, total_fixtures_seen, total_odds_rows}' data/odds/${BOOKMAKER_SLUG}/latest.json || echo "no latest.json"

          echo
          echo "== odds.txt tail =="
          test -f data/odds/${BOOKMAKER_SLUG}/odds.txt && tail -n 80 data/odds/${BOOKMAKER_SLUG}/odds.txt || echo "no odds.txt"

      - name: Upload odds artifacts (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: odds-${{ matrix.slug }}
          if-no-files-found: warn
          path: |
            data/odds/${{ matrix.slug }}/**/*.json
            data/odds/${{ matrix.slug }}/*.txt

      - name: Commit odds to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "odds: update ${{ matrix.slug }} (PP/Unibet) [skip ci]"
          file_pattern: data/odds/${{ matrix.slug }}/**
          add_options: "-A"
