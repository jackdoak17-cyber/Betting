name: Fetch odds — Paddy Power & Unibet (then compare vs Bet365)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # hourly

jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: 19, slug: paddypower, name: "Paddy Power" }
          - { id: 23, slug: unibet,     name: "Unibet" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch odds for ${{ matrix.name }}
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          BOOKMAKER_ID:   ${{ matrix.id }}
          BOOKMAKER_SLUG: ${{ matrix.slug }}
          BOOKMAKER_NAME: ${{ matrix.name }}
          SM_SLEEP: "0.03"
          SM_TIMEOUT: "25"
        run: |
          set -euo pipefail
          echo "== Fetching odds for ${BOOKMAKER_NAME} (id=${BOOKMAKER_ID}, slug=${BOOKMAKER_SLUG}) =="
          python scripts/fetch_odds.py

          echo
          echo "== Tree of data/odds/${BOOKMAKER_SLUG} =="
          if [ -d "data/odds/${BOOKMAKER_SLUG}" ]; then
            find "data/odds/${BOOKMAKER_SLUG}" -maxdepth 3 -type f | sort
          else
            echo "no directory: data/odds/${BOOKMAKER_SLUG}"
          fi

          echo
          echo "== odds.txt tail =="
          if [ -f "data/odds/${BOOKMAKER_SLUG}/odds.txt" ]; then
            tail -n 80 "data/odds/${BOOKMAKER_SLUG}/odds.txt"
          else
            echo "no odds.txt"
          fi

      - name: Upload odds artifacts (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: odds-${{ matrix.slug }}
          if-no-files-found: warn
          path: |
            data/odds/${{ matrix.slug }}/**/*.json
            data/odds/${{ matrix.slug }}/*.txt

      - name: Auto-commit odds to repo (${{ matrix.name }})
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(odds): update ${{ matrix.slug }} odds"
          file_pattern: |
            data/odds/${{ matrix.slug }}/**/*.json
            data/odds/${{ matrix.slug }}/*.txt
