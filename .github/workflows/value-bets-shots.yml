name: Value Bets — Player Shots & SOT

on:
  workflow_dispatch:
    inputs:
      min_decimal_price:
        description: "Minimum Bet365 decimal price to include (e.g., 1.30)"
        required: false
        default: "1.30"
      commit_results:
        description: "Commit results back to repo (true/false)"
        required: false
        default: "true"
  schedule:
    # NOTE: GitHub Actions uses UTC. 06:05 UTC ≈ 07:05 Europe/London during BST.
    - cron: "5 6 * * *"

concurrency:
  group: value-bets-shots
  cancel-in-progress: true

permissions:
  contents: write  # allow committing the generated file
  actions: read

env:
  PYTHON_VERSION: "3.11"
  RESULTS_DIR: "data/value_bets"
  RESULTS_FILE: "shots_and_sot.txt"
  # Fallback if workflow_dispatch input omitted:
  MIN_DEC_PRICE: "${{ github.event.inputs.min_decimal_price || '1.30' }}"
  COMMIT_RESULTS: "${{ github.event.inputs.commit_results || 'true' }}"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify inputs & files
        run: |
          if [ -z "${{ secrets.ODDS_API_KEY }}" ]; then
            echo "ERROR: ODDS_API_KEY secret is not set." >&2
            exit 1
          fi
          if [ ! -f "scripts/value_bets_player_shots.py" ]; then
            echo "ERROR: scripts/value_bets_player_shots.py not found." >&2
            exit 1
          fi
          if [ ! -f "data/player_filters/players_by_criteria.json" ]; then
            echo "ERROR: data/player_filters/players_by_criteria.json not found." >&2
            exit 1
          fi

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            # Minimal deps for the script
            pip install requests
          fi

      - name: Run value-bets (Player Shots & SOT) — Bet365 only
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MIN_DEC_PRICE: ${{ env.MIN_DEC_PRICE }}
        run: |
          mkdir -p "${RESULTS_DIR}"
          # Run and tee output to file
          python scripts/value_bets_player_shots.py | tee "${RESULTS_DIR}/${RESULTS_FILE}"
          echo "" >> "${RESULTS_DIR}/${RESULTS_FILE}"
          echo "Run timestamp (UTC): $(date -u +"%Y-%m-%d %H:%M:%S")" >> "${RESULTS_DIR}/${RESULTS_FILE}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: value-bets-shots-${{ github.run_number }}
          path: ${{ env.RESULTS_DIR }}/${{ env.RESULTS_FILE }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: Append summary
        if: always()
        run: |
          {
            echo "## Value Bets — Player Shots & Shots On Target (Bet365)"
            echo ""
            echo "- **Min decimal price**: ${MIN_DEC_PRICE}"
            echo "- **Generated file**: \`${RESULTS_DIR}/${RESULTS_FILE}\`"
            echo ""
            echo "### Preview (first 120 lines)"
            echo '```'
            head -n 120 "${RESULTS_DIR}/${RESULTS_FILE}" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results back to repo (optional)
        if: ${{ env.COMMIT_RESULTS == 'true' }}
        run: |
          if git diff --quiet -- ${RESULTS_DIR}/${RESULTS_FILE}; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${RESULTS_DIR}/${RESULTS_FILE}"
          git commit -m "chore(value-bets): update ${RESULTS_DIR}/${RESULTS_FILE} [skip ci]"
          git push
