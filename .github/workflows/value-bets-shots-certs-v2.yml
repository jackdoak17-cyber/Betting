name: Value — Shot Bet Certs (V2)

on:
  schedule:
    - cron: "0 */2 * * *"  # every 2 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: value-bets-shots-certs-v2
  cancel-in-progress: false

jobs:
  build-shot-certs-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      MIN_DEC_PRICE: "1.25"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run shot bet certs (V2)
        run: |
          python scripts/value_bets/Player_value_bets_V2/value_bets_shots_certs_v2.py

      - name: Commit & push outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/value_bets/Player_value_bets_V2/value_bets_shots_certs_v2.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(shots-certs-v2): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH" || true
          git push origin HEAD:"$BRANCH"
