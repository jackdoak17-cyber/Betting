name: _Reusable • Odds • Sportmonks Runner

on:
  workflow_call:
    inputs:
      script_path:
        description: "Path to the Python script to run"
        required: true
        type: string
      results_file:
        description: "Filename to write into data/value_bets/"
        required: true
        type: string
      min_decimal_price:
        description: "Minimum decimal price"
        required: false
        default: "1.30"
        type: string
      team_win_max:
        description: "Max Team ML allowed"
        required: false
        default: "3.50"
        type: string
    secrets:
      SPORTMONKS_TOKEN:
        required: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  RESULTS_DIR: "data/value_bets"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: odds-sm-${{ inputs.results_file }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Verify inputs
        run: |
          test -n "${{ secrets.SPORTMONKS_TOKEN }}" || (echo "SPORTMONKS_TOKEN missing" >&2; exit 1)
          test -f "${{ inputs.script_path }}" || (echo "script missing: ${{ inputs.script_path }}" >&2; exit 1)
          test -d "data/player_shots/by_league" || (echo "shots dir missing" >&2; exit 1)
          test -d "data/predicted_xi/by_league" || (echo "predicted XI dir missing" >&2; exit 1)

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ${{ inputs.script_path }}
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          MIN_DEC_PRICE: ${{ inputs.min_decimal_price }}
          TEAM_WIN_MAX:  ${{ inputs.team_win_max }}
        run: |
          mkdir -p "${RESULTS_DIR}"
          python "${{ inputs.script_path }}" | tee "${RESULTS_DIR}/${{ inputs.results_file }}"
          echo "" >> "${RESULTS_DIR}/${{ inputs.results_file }}"
          echo "Run timestamp (UTC): $(date -u +"%Y-%m-%d %H:%M:%S")" >> "${RESULTS_DIR}/${{ inputs.results_file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.results_file }}-${{ github.run_number }}
          path: ${{ env.RESULTS_DIR }}/${{ inputs.results_file }}
          if-no-files-found: error
          retention-days: 7

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${RESULTS_DIR}/${{ inputs.results_file }}"
          git diff --cached --quiet || git commit -m "feat(odds-sm): update ${{ inputs.results_file }} [skip ci]"
          git push || true
