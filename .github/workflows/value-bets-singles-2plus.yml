name: Value Bets — Singles 2+ Shots (Over 1.5)

on:
  # Odds job is at :07; other value jobs at :12/:18/:24 — run this at :30
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Fetch Bet365 odds (Sportmonks pre-match — 9 leagues)"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: value-bets-singles-2plus
  cancel-in-progress: true

jobs:
  value_singles_2plus:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run value singles (2+ shots)
        env:
          MIN_DEC_PRICE: "1.72"     # keep strictly greater than this
          FAVORITES_ONLY: "true"    # remove underdogs
          FAVORITE_CAP_4OF5: "2.50" # extra cap for 4/5 path
          # Optionally restrict leagues:
          # LEAGUE_IDS: "8,9"
        run: |
          python scripts/value_bets/value_singles_shots2_sportmonks.py
          echo "----- OUTPUT (preview) -----"
          if [ -f data/value_bets/value_singles_2plus.txt ]; then
            tail -n 200 data/value_bets/value_singles_2plus.txt || true
          else
            echo "data/value_bets/value_singles_2plus.txt not found."
          fi

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/value_bets/value_singles_2plus.txt
          git commit -m "chore(value-bets): singles 2+ update $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes"
          git push
