name: Value — Player Tackles (Certs & Value)

on:
  # Daily at 07:50 UTC (adjust as needed)
  schedule:
    - cron: "50 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: value-player-tackles
  cancel-in-progress: true

jobs:
  tackles-value:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tunables for the script (change or remove to use script defaults)
      LEAGUE_IDS: "301,384,387,564,567,600,8,82,9"
      WINDOW_DAYS: "7"
      MIN_CERT_PRICE: "1.80"     # Certs O0.5 > 1.80
      MIN_SINGLE_PRICE: "1.72"   # Value singles O0.5 ≥ 1.72
      MIN_TWO_PRICE: "1.80"      # Value 2+ O1.5 > 1.80
      OUT_FILE: "data/value_bets/tackles_value.txt"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (none needed)
        run: echo "No external dependencies required."

      - name: Run player tackles value finder
        run: |
          python scripts/value_bets/tackles_value.py
          echo "----- ${OUT_FILE} -----"
          cat "${OUT_FILE}" || true
          echo "-----------------------------------------"

      - name: Commit & push results (rebase-safe)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git config --global user.name  "${GIT_COMMITTER_NAME}"
          git config --global user.email "${GIT_COMMITTER_EMAIL}"

          git fetch origin main
          git checkout -B main origin/main

          git add "${OUT_FILE}" || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "chore(value-tackles): update ${ts}"

          for attempt in 1 2 3; do
            git rebase --abort || true
            git pull --rebase --autostash origin main || true
            if git push --force-with-lease origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt — retrying..."
            sleep 2
          done

          echo "Final attempt after fresh fetch..."
          git rebase --abort || true
          git fetch origin main
          git pull --rebase --autostash origin main || true
          git push --force-with-lease origin HEAD:main
