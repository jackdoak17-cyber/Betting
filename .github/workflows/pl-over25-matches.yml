# .github/workflows/over25-matches-all.yml
name: Posts — Over 2.5 (All Leagues, Combined%)

on:
  schedule:
    - cron: "40 7 * * *"   # Daily at 07:40 UTC (after your fixtures job)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: over25-matches-all
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      PYTHONUNBUFFERED: "1"

      # Script knobs
      LAST_N: "10"
      MIN_GAMES: "6"
      MAX_ROWS: "20"
      LOOKBACK_DAYS: "140"

      # Leagues you want (no cups)
      LEAGUE_IDS: >
        8 9 72 82 181 208 244 271 301 384 387
        444 453 462 486 501 564 567 573 591 600

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate posts for all leagues (sequential; always write a file)
        run: |
          set -euo pipefail
          for LID in ${LEAGUE_IDS}; do
            echo "=== League ${LID} ==="
            LEAGUE_ID="${LID}" OUTPUT_PATH="posts/over25_matches_L${LID}.md" \
              python scripts/posts/over25_matches.py || echo "::warning::Script returned non-zero for ${LID}"
          done

      - name: Show a quick sample of outputs
        run: |
          ls -1 posts/over25_matches_*.md | head -n 10 || true
          echo
          for f in $(ls -1 posts/over25_matches_*.md | head -n 3); do
            echo "----- $f -----"
            head -n 40 "$f" || true
            echo
          done

      - name: Commit & push once
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posts/over25_matches_*.md || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "Update: Over 2.5 Candidates (multi-league) — ${ts}"

          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase --autostash origin "$BRANCH" || true
          git push origin HEAD:"$BRANCH"
