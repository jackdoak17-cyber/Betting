name: Predict lineups (all leagues)

on:
  schedule:
    - cron: "0 6 * * 1"     # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: predict-lineups-all
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0                # full history so rebase works
          persist-credentials: true     # use GITHUB_TOKEN for push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Predict lineups
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          python scripts/predict_lineups.py

      - name: Commit & push results
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Stage only generated data (add -A so new files are included)
          git add -A data/predicted_xi

          # If nothing changed, exit quietly
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # 1) Commit FIRST, so the worktree is clean for rebase
          git commit -m "chore(predicted_xi): per-league update $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # 2) Rebase our new commit(s) onto latest remote and push
          # Try up to 3 times in case remote moves between fetch & push
          for attempt in 1 2 3; do
            echo "Rebasing onto origin/main (attempt ${attempt})..."
            git pull --rebase --autostash origin main

            echo "Pushing to origin/main..."
            if git push origin HEAD:main; then
              echo "Pushed successfully."
              exit 0
            fi

            echo "Push failed; retrying after a short backoff..."
            sleep $((attempt*2))
          done

          echo "Push failed after retries."
          exit 1