name: Predict lineups (all leagues)

on:
  schedule:
    - cron: "0 6 * * 1"     # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: predict-lineups-all
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0                # needed for clean rebases
          persist-credentials: true     # use GITHUB_TOKEN for push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Predict lineups
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          python scripts/predict_lineups.py

      - name: Commit & push results
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Make sure local main is aligned before we commit
          git fetch origin main
          git checkout -B main
          git rebase origin/main

          # Stage only the generated data directory
          git add -A data/predicted_xi

          # If nothing changed, exit quietly
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(predicted_xi): per-league update $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Push with up to 3 attempts in case the remote moves between fetch and push
          attempts=0
          until git push origin HEAD:main; do
            attempts=$((attempts+1))
            if [ $attempts -ge 3 ]; then
              echo "Push failed after $attempts attempts."
              exit 1
            fi
            echo "Remote updated; rebasing onto latest origin/main and retrying (attempt $attempts)..."
            git pull --rebase origin main
          done

          echo "Pushed successfully."