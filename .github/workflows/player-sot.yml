name: Player shots on target (current season, league-only, ≥45')

on:
  schedule:
    - cron: "15 8 * * 1"   # Mondays at 08:15 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: fetch-player-sot
      cancel-in-progress: false
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build SOT series
        run: |
          python scripts/fetch_player_sot.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/player_shots_on_target
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(player_sot): weekly update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
