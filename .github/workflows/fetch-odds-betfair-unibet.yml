# .github/workflows/fetch-odds-betfair-unibet.yml
name: Fetch odds — Betfair & Unibet (Sportmonks pre-match — 9 leagues)

on:
  schedule:
    - cron: "13 */2 * * *"   # every 2 hours at :13
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    name: fetch ({{matrix.id}}, {{matrix.slug}}, {{matrix.name}})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - id: 9
            slug: betfair
            name: Betfair
          - id: 23
            slug: unibet
            name: Unibet

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanity check secret
        run: |
          if [ -z "${{ secrets.SPORTMONKS_TOKEN }}" ]; then
            echo "ERROR: SPORTMONKS_TOKEN secret is missing." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Fetch odds ({{matrix.id}}, {{matrix.slug}}, {{matrix.name}})
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          LEAGUE_IDS: "301,384,387,564,567,600,8,82,9"
          SM_BOOKMAKER_ID: "${{ matrix.id }}"   # 9=Betfair, 23=Unibet
          SM_TIMEOUT: "20"
          SM_SLEEP: "0.05"
        run: |
          set -euo pipefail
          # Use the same gather script you already run for PP/Unibet
          python scripts/odds_sportmonks_gather.py

      - name: Commit & push odds files
        env:
          PROVIDER_DIR: "data/odds/${{ matrix.slug }}"
          DEFAULT_BRANCH: main
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git config --global user.name  "${GIT_COMMITTER_NAME}"
          git config --global user.email "${GIT_COMMITTER_EMAIL}"

          git add -A "${PROVIDER_DIR}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "chore(odds-${{ matrix.slug }}): update ${ts}"

          git fetch origin "${DEFAULT_BRANCH}"
          git pull --rebase --autostash origin "${DEFAULT_BRANCH}" || true
          git push --force-with-lease origin HEAD:"${DEFAULT_BRANCH}"
