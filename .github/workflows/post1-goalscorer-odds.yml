name: Top Scorers (Anytime)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/3000 * * * *"  # every 30 minutes

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip requests

      - name: Generate post
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          OUTPUT_PATH: posts/top_scorers_anytime.md
        run: python scripts/posts/top_scorers_anytime.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/top_scorers_anytime.md
          git commit -m "chore: update Top Scorers (Anytime)" || echo "No changes"
          git push
