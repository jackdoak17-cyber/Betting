name: Post 1 - Goal scorer odds

on:
  schedule:
    - cron: "15 9 * * 5"  # Fridays 09:15 UTC (tweak if you want another cadence)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: post1-goalscorer-odds
      cancel-in-progress: false
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      # Configure leagues & options here:
      LEAGUE_IDS: "8"        # e.g. 8=Premier League; add more like "8,82,384"
      TOP_N: "10"
      BOOKMAKER_IDS: ""      # e.g. "2" for Bet365; leave blank to use all
      MARKET_IDS: ""         # set Anytime market id(s) if known; else leave blank
      ODDS_FALLBACK_ALL: "1" # scan market names for “Anytime” if MARKET_IDS unset

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build "Boot & Book" post
        run: |
          python scripts/posts/top_scorers_anytime.py

      - name: Commit & push post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/social/top_scorers_anytime_*.md
          if git diff --cached --quiet; then
            echo "No new post to commit."
          else
            git commit -m "feat(social): Post 1 - Goal scorer odds $(date -u +'%Y-%m-%d')"
            git push
          fi