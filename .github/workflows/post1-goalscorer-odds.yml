name: Top Scorers (Anytime)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"  # every 30 min

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate post
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          # Optional overrides:
          # LEAGUE_IDS: "8,564,82,384,301"
          # LIMIT_PER_LEAGUE: "10"
          # WINDOW_DAYS: "14"
        run: |
          python scripts/posts/top_scorers_anytime.py

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add betting/posts/top_scorers_anytime.md
            git add data/debug/topscorers_raw_*.json || true
            git commit -m "chore(posts): update Top Scorers (Anytime) [skip ci]"
            git push
          else
            echo "No changes."
          fi
