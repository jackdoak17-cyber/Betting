name: Post 1 - Build Top Scorers (Anytime)

on:
  schedule:
    - cron: "*/3000 * * * *"   # every 30 minutes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-post:
    runs-on: ubuntu-latest
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate post
        run: |
          python scripts/posts/top_scorers_anytime.py

      - name: Commit & push if changed
        run: |
          CHANGED=$(git status --porcelain)
          if [ -n "$CHANGED" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/posts/top_scorers_anytime.md
            git commit -m "chore(posts): update Top Scorers (Anytime) [skip ci]"
            git push
          else
            echo "No changes."
          fi
