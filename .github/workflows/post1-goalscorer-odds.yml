name: Post 1 - Goal scorer odds

on:
  schedule:
    - cron: "15 9 * * 5"  # Fridays at 09:15 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: post1-goalscorer-odds
      cancel-in-progress: false
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      # Big 5 league IDs (adjust if your IDs differ)
      LEAGUE_IDS: "8,564,384,82,301"   # EPL, LaLiga, Serie A, Bundesliga, Ligue 1
      TOP_N: "10"
      BOOKMAKER_IDS: ""                # e.g. "2" for Bet365; leave blank to scan all
      MARKET_IDS: ""                   # set Anytime market id(s) if known; else leave blank
      ODDS_FALLBACK_ALL: "1"           # scan market names if MARKET_IDS unset

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build post (Top scorers × Anytime odds)
        run: |
          python scripts/posts/top_scorers_anytime.py

      - name: Commit & push post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ls reports/social/top_scorers_anytime_*.md 1> /dev/null 2>&1; then
            git add reports/social/top_scorers_anytime_*.md
            if git diff --cached --quiet; then
              echo "No new post to commit."
            else
              git commit -m "feat(social): Post 1 - Goal scorer odds $(date -u +'%Y-%m-%d')"
              git push
            fi
          else
            echo "No post file generated; skipping commit."
          fi