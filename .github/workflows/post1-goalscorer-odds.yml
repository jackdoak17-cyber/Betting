name: Post — Top Scorers Anytime Odds

on:
  workflow_dispatch:
  schedule:
    # Run daily at 07:00 UTC
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate post
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          OUTPUT_PATH: posts/top_scorers_anytime.md
        run: python scripts/posts/top_scorers_anytime.py

      - name: Commit & push (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/top_scorers_anytime.md
          git diff --quiet && echo "No changes to commit." || git commit -m "Update: Top Scorers (Anytime) + Bet365 odds [skip ci]"
          git push
