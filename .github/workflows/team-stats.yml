name: Team stats (Sportmonks)

on:
  schedule:
    - cron: "0 7 * * 1"   # Every Monday at 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: team-stats
  cancel-in-progress: true

jobs:
  team_stats:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      TEAM_STATS_LAST_N: "10"
      # Optional overrides for type IDs if Sportmonks changes them:
      # TEAM_STAT_SHOTS_TOTAL_ID: "42"
      # TEAM_STAT_SHOTS_ON_TARGET_ID: "86"
      # TEAM_STAT_FOULS_ID: "56"
      # TEAM_STAT_TACKLES_ID: "78"
      # TEAM_STAT_YELLOW_CARDS_ID: "84"
      # TEAM_STAT_RED_CARDS_ID: "83"
      # TEAM_STAT_SAVES_ID: "57"
      # TEAM_STAT_GOAL_KICKS_ID: "53"
      # TEAM_STAT_CORNERS_ID: "34"

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Build team stats
        run: |
          python scripts/team_stats.py
          python scripts/render_team_stats_summary.py || true
          python scripts/check_team_stats_coverage.py || true

      - name: Commit & push (rebase-safe)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          # Configure identity and base branch on latest remote main
          git config --global user.name  "${GIT_COMMITTER_NAME}"
          git config --global user.email "${GIT_COMMITTER_EMAIL}"
          git fetch origin main
          git checkout -B main origin/main

          # Stage outputs (include deletions)
          git add -A data/team_stats

          # Exit if nothing to commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "chore(team_stats): update ${ts}"

          # Rebase on latest and push with lease; retry a few times to avoid races
          for attempt in 1 2 3; do
            git rebase --abort || true
            git pull --rebase --autostash origin main || true
            if git push --force-with-lease origin HEAD:main; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Push failed on attempt ${attempt} — retrying..."
            sleep 2
          done

          echo "Final attempt after fresh fetch..."
          git rebase --abort || true
          git fetch origin main
          git pull --rebase --autostash origin main || true
          git push --force-with-lease origin HEAD:main
