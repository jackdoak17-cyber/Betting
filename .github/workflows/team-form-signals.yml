name: Build — Team Form Signals (Corners/Cards/Shots/SOT)

on:
  schedule:
    # Daily at 07:20 UTC
    - cron: "20 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: team-form-signals
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
  # ---- Tuning (optional, script has defaults) ----
  LEAGUE_IDS: "8"         # add more: "8,564,82,384,301"
  LAST_N: "10"
  MIN_MATCHES: "6"
  EDGE_MIN_WIN: "0.60"
  EDGE_MAX_WIN: "0.40"
  CARD_RED_WEIGHT: "1"
  OUT_BASE: "data/team_stats"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sanity check secret
        run: |
          if [ -z "${SPORTMONKS_TOKEN:-}" ]; then
            echo "ERROR: SPORTMONKS_TOKEN is not available to this job." >&2
            exit 1
          fi

      - name: Generate team form signals
        run: python scripts/team_form_signals.py

      - name: Show summary
        run: |
          echo "----- data/team_stats/summary.txt -----"
          cat data/team_stats/summary.txt || true
          echo "---------------------------------------"

      - name: Commit & push outputs
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git config --global user.name  "${GIT_COMMITTER_NAME}"
          git config --global user.email "${GIT_COMMITTER_EMAIL}"

          git add -A data/team_stats/by_league/*.json \
                     data/team_stats/mismatches/*.json \
                     data/team_stats/summary.txt || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "chore(team-form): update ${ts}"

          # Rebase & push with a couple of retries to reduce conflicts
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push --force-with-lease origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt — retrying..."
            sleep 2
          done

          echo "Final attempt after fresh fetch..."
          git fetch origin main
          git pull --rebase --autostash origin main || true
          git push --force-with-lease origin HEAD:main
