name: Fetch player shots (all leagues)

on:
  schedule:
    - cron: "0 7 * * 1"     # every Monday 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: fetch-player-shots-all
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Fetch player shots
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          python scripts/fetch_player_shots.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/player_shots
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(player_shots): per-league update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
