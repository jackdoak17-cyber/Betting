name: Scrape Player Odds Daily

on:
  schedule:
    # Run once daily at 7pm UTC (19:00)
    - cron: '0 19 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Scrape odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/odds_api/scrape_player_odds.py

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/odds_api/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update player odds $(date +'%Y-%m-%d %H:%M UTC')" && git push)
