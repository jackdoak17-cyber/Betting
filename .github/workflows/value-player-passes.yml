# .github/workflows/value-player-passes.yml
name: Value — Player Passes (Bet365)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "20 7 * * *"   # daily at 07:20 UTC

permissions:
  contents: write

concurrency:
  group: value-player-passes
  cancel-in-progress: true

jobs:
  passes-value:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ---- Tunables for the script ----
      LEAGUE_IDS: "301,384,387,564,567,600,8,82,9"
      WINDOW_DAYS: "7"
      MIN_DEC_PRICE: "1.72"
      TEAM_WIN_MAX: "4.00"   # drop if team ML >= this
      MARKET_PASSES_ID: "290"  # override if your Bet365 passes market_id differs

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (none needed)
        run: echo "No external dependencies required."

      - name: Run Passes value finder
        run: |
          python scripts/value_bets/passes_value_sportmonks.py
          echo "----- data/value_bets/passes_value.txt -----"
          cat data/value_bets/passes_value.txt || true
          echo "--------------------------------------------"

      - name: Commit & push results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/value_bets/passes_value.txt || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(value): update Player Passes $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH" || true
          git push origin HEAD:"$BRANCH"
