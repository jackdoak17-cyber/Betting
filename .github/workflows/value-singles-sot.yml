name: Value bets — SOT Value Singles (Sportmonks)

on:
  workflow_dispatch:
    inputs:
      league_ids:
        description: "Comma-separated Sportmonks league IDs (blank = auto-discover)"
        required: false
        default: ""
      min_decimal_price:
        description: "Min Bet365 price for Over 0.5 SOT"
        required: false
        default: "1.72"
      team_underdog_max:
        description: "Drop if team ML >= this (underdog cutoff)"
        required: false
        default: "3.50"
      fav_max:
        description: "Allow 4/5 window only if team ML <= this"
        required: false
        default: "2.50"
      window_days:
        description: "Only fixtures in next N days (0 = no limit)"
        required: false
        default: "7"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  RESULTS_DIR: "data/value_bets"
  RESULTS_FILE: "value_singles_sot.txt"
  LEAGUE_IDS:        "${{ github.event.inputs.league_ids || '' }}"
  MIN_DEC_PRICE:     "${{ github.event.inputs.min_decimal_price || '1.72' }}"
  TEAM_UNDERDOG_MAX: "${{ github.event.inputs.team_underdog_max || '3.50' }}"
  FAV_MAX:           "${{ github.event.inputs.fav_max || '2.50' }}"
  WINDOW_DAYS:       "${{ github.event.inputs.window_days || '7' }}"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Verify script & data folders
        run: |
          test -f "scripts/value_bets/value_singles_sot.py" || (echo "scripts/value_bets/value_singles_sot.py not found" >&2; exit 1)
          test -d "data/fixtures" || (echo "data/fixtures not found" >&2; exit 1)
          test -d "data/player_shots_on_target/by_league" || (echo "data/player_shots_on_target/by_league not found" >&2; exit 1)
          test -d "data/odds/b365/fixtures" || (echo "data/odds/b365/fixtures not found" >&2; exit 1)

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run — SOT Value Singles
        env:
          LEAGUE_IDS:        ${{ env.LEAGUE_IDS }}
          MIN_DEC_PRICE:     ${{ env.MIN_DEC_PRICE }}
          TEAM_UNDERDOG_MAX: ${{ env.TEAM_UNDERDOG_MAX }}
          FAV_MAX:           ${{ env.FAV_MAX }}
          WINDOW_DAYS:       ${{ env.WINDOW_DAYS }}
        run: |
          set -e
          mkdir -p "${RESULTS_DIR}"
          python scripts/value_bets/value_singles_sot.py | tee "${RESULTS_DIR}/${RESULTS_FILE}"
          {
            echo ""
            echo "Run timestamp (UTC): $(date -u +"%Y-%m-%d %H:%M:%S")"
            echo "Params: LEAGUE_IDS='${LEAGUE_IDS}' MIN_DEC_PRICE=${MIN_DEC_PRICE} TEAM_UNDERDOG_MAX=${TEAM_UNDERDOG_MAX} FAV_MAX=${FAV_MAX} WINDOW_DAYS=${WINDOW_DAYS}"
          } >> "${RESULTS_DIR}/${RESULTS_FILE}"

      - uses: actions/upload-artifact@v4
        with:
          name: value-singles-sot-${{ github.run_number }}
          path: ${{ env.RESULTS_DIR }}/${{ env.RESULTS_FILE }}
          if-no-files-found: error
          retention-days: 7

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${RESULTS_DIR}/${RESULTS_FILE}"
          git diff --cached --quiet || git commit -m "feat(value): update SOT value singles [skip ci]"
          git push || true
