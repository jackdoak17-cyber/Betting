name: Player filters (criteria)

on:
  schedule:
    # Run after your player collectors. Adjust if your collectors run later.
    - cron: "30 7 * * 1"   # Every Monday at 07:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build_player_filters:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # No third-party deps needed for the selector; keep step for future use

      - name: Run player selection
        run: |
          python scripts/select_player_criteria.py

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player_filters/players_by_criteria.txt data/player_filters/players_by_criteria.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(player-filters): refresh $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
