name: Value — Offsides Match Bet (Bet365)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: value-offsides-match-bet
  cancel-in-progress: true

jobs:
  offsides-match-bet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ---- Tunables for the script (can be overridden at dispatch time if you add inputs) ----
      WINDOW_DAYS: "7"
      MIN_DEC_PRICE: "1.70"
      MIN_SIDE_RATE: "0.55"
      MIN_GAP: "0.15"
      MAX_OPP_RATE: "0.50"
      OUT_PATH: "data/value_bets/offsides_match_bet.txt"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (none needed)
        run: echo "No external dependencies required."

      - name: Run Offsides value finder
        run: |
          python scripts/value_bets/offsides_match_bet.py
          echo "----- ${OUT_PATH} -----"
          cat "${OUT_PATH}" || true
          echo "-----------------------------------------"

      - name: Commit & push results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${OUT_PATH}"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(value): update Offsides Match Bet $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH" || true
          git push origin HEAD:"$BRANCH"
