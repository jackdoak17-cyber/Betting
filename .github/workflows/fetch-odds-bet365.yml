name: Fetch Bet365 odds (Sportmonks pre-match — 9 leagues)

on:
  schedule:
    # Every 6 hours at :07 UTC (staggered from fixtures job at :05)
    - cron: "7 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch_odds_bet365:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests

      - name: Run Bet365 odds gatherer (all 9 leagues)
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          LEAGUE_IDS: "301,384,387,564,567,600,8,82,9"
          SM_BOOKMAKER_ID: "2"  # Bet365
          SM_SLEEP: "0.05"
          SM_TIMEOUT: "20"
        run: python scripts/odds_bet365_gather.py

      - name: Commit & push odds files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds/b365
          git commit -m "chore(odds-b365): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes"
          git push
