name: Fetch Bet365 odds (Sportmonks pre-match, EPL only)

on:
  schedule:
    # Every 6 hours at :07 UTC (staggered from your fixtures job at :05)
    - cron: "7 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch_odds_bet365:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests

      - name: Run Bet365 odds gatherer (EPL only)
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          LEAGUE_IDS: "8"          # <-- EPL only
          SM_BOOKMAKER_ID: "2"     # Bet365
          SM_SLEEP: "0.05"         # gentle pacing; you can bump to 0.1 if needed
          SM_TIMEOUT: "20"
        run: python scripts/odds_bet365_gather.py

      - name: Commit & push odds files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds/b365
          git commit -m "chore(odds-b365-epl): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes"
          git push
