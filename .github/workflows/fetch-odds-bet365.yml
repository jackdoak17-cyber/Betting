name: Fetch Bet365 odds (Sportmonks pre-match — 9 leagues)

on:
  # every 2 hours at :07 UTC (stagger this minute if you want)
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Prevent two runs from writing at once
concurrency:
  group: odds-b365
  cancel-in-progress: false

jobs:
  fetch_odds_bet365:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanity check secret
        run: |
          if [ -z "${{ secrets.SPORTMONKS_TOKEN }}" ]; then
            echo "ERROR: SPORTMONKS_TOKEN secret is missing." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # If you keep a requirements.txt, this will use it; otherwise we at least install requests.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests

      - name: Run Bet365 odds gatherer (9 leagues)
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          LEAGUE_IDS: "8,9,72,82,181,208,244,271,301,384,387,444,453,462,501,564,567,573,591,600"
          SM_BOOKMAKER_ID: "2"   # Bet365
          SM_SLEEP: "0.05"
          SM_TIMEOUT: "20"
        run: python scripts/odds_bet365_gather.py

      - name: Commit & push odds files (robust rebase with lease)
        env:
          DEFAULT_BRANCH: main
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git config --global user.name  "${GIT_COMMITTER_NAME}"
          git config --global user.email "${GIT_COMMITTER_EMAIL}"

          # Stage only the odds outputs
          git add -A data/odds/b365

          # Exit quietly if nothing changed
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "chore(odds-b365): update ${ts}"

          # Rebase onto latest and push with a lease; retry a few times to dodge 'fetch first'
          for attempt in 1 2 3; do
            git fetch origin "${DEFAULT_BRANCH}"
            git pull --rebase --autostash origin "${DEFAULT_BRANCH}" || true
            if git push --force-with-lease origin HEAD:"${DEFAULT_BRANCH}"; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Push failed on attempt ${attempt} — retrying..."
            sleep 3
          done

          echo "Final attempt after a fresh fetch..."
          git fetch origin "${DEFAULT_BRANCH}"
          git pull --rebase --autostash origin "${DEFAULT_BRANCH}" || true
          git push --force-with-lease origin HEAD:"${DEFAULT_BRANCH}"
