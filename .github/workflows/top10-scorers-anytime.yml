name: Post — Top 10 Scorers (Anytime)

on:
  schedule:
    # Daily at 07:05 UTC
    - cron: "5 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: top10-anytime
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Generate Top 10 Scorers (Anytime) — list + table
        env:
          OUTPUT_PATH: posts/top10_scorers
