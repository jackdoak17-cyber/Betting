name: Find player bet candidates

on:
  schedule:
    # Stagger after your player selectors (adjust as needed)
    - cron: "45 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  find_candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run finder
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Hard-lock to just these books
          ODDS_BOOKMAKERS: "bet365,kambi"
          # Keep multi calls safe/lightweight
          ODDS_MULTI_CHUNK: "10"
          # (Optional tuning)
          CERT_MIN_PRICE: "1.25"
          CERT_MIN_N: "8"
          VALUE_MIN_PRICE: "1.80"
          UNDERDOG_MAX_ML: "3.50"
        run: |
          python scripts/find_player_bets.py

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bets/player_candidates.json data/bets/player_candidates.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(bets): refresh candidates $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
