name: Weekly stats – shots (last 10)

on:
  schedule:
    - cron: "30 7 * * 1"   # Mondays 07:30 UTC (after your 06:00 lineups)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: weekly-stats-shots
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Build last-10 shots
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          SHOTS_BACK_DAYS: "150"
        run: |
          python scripts/ingest_shots.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/player_stats/shots
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(shots): last-10 update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
