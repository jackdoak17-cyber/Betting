name: Shots stats

on:
  workflow_dispatch: {}
  schedule:
    # Weekly run — adjust day/hour (UTC) as you like
    - cron: "15 03 * * MON"

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull fixtures + XIs (next 6 days)
        run: python scripts/fixtures_lineups.py

      - name: Compute shots stats
        run: python scripts/stats_shots.py

      - name: Commit data back to repo
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RUN_DATE="$(date -u +%F)"
          mkdir -p "data/${RUN_DATE}" "data/latest"

          # Just commit whatever the scripts wrote
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update shots stats (UTC ${RUN_DATE}) [skip ci]"
            git push
          fi
