name: Weekly Shots Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * MON"   # Mondays 06:00 UTC — change if you like

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        league_id: [8, 9, 384, 387, 82, 301, 564, 567, 600]  # EPL, Champ, Serie A/B, Bundesliga, Ligue 1, La Liga/2, Super Lig

    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure data folders
        run: |
          mkdir -p data data/fixtures data/lineups data/stats .cache_smonks .cache_odds

      - name: Fetch fixtures & predicted lineups (next 6 days)
        run: |
          python scripts/fixtures_lineups.py

      - name: Compute shots stats for league
        run: |
          python scripts/stats_shots.py ${{ matrix.league_id }}

      - name: Upload artifacts (per-league)
        uses: actions/upload-artifact@v4
        with:
          name: stats-shots-${{ matrix.league_id }}
          path: |
            data/stats/**
            data/fixtures/**
            data/lineups/**
