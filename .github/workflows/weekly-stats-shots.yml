name: Weekly stats (shots)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 6 * * 1"   # Mondays 06:30 UTC (after your 06:00 lineups if you like)

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Ingest shots (last 10, all comps)
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          python scripts/ingest_shots.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/player_stats/shots
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(stats): update shots (last10, all comps) $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
