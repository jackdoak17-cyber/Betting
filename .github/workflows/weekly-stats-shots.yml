name: Weekly Shots Stats

on:
  workflow_dispatch:
  schedule:
    # run weekly Monday 06:00 UTC (change as you like)
    - cron: '0 6 * * 1'

jobs:
  build:
    name: build (${{ matrix.league }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        league: [8, 9, 384, 387, 82, 301, 564, 567, 600]  # EPL, Champ, Serie A/B, Bundesliga, Ligue 1, La Liga/2, Super Lig

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure data folders
        run: |
          mkdir -p data .cache_smonks .cache_odds

      - name: Fetch fixtures & predicted lineups (next 6 days)
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          python scripts/fixtures_lineups.py

      - name: Compute shots stats for league
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          python scripts/stats_shots.py ${{ matrix.league }}

      - name: Upload artifacts (per-league)
        uses: actions/upload-artifact@v4
        with:
          name: shots_stats_${{ matrix.league }}
          path: |
            data/shots_stats_${{ matrix.league }}.jsonl
            data/fixtures_${{ matrix.league }}.jsonl
          if-no-files-found: warn
