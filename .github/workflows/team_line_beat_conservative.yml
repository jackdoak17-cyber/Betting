name: Odds — Team Line Beat (Conservative)

on:
  workflow_dispatch:
    inputs:
      min_decimal_price:
        description: "Minimum decimal price to include"
        default: "1.20"
      team_win_max:
        description: "Max Team ML for Shots/Corners OVER"
        default: "3.50"
      combo_min:
        description: "Minimum combo% (0-1) to include"
        default: "0.50"
      window_days:
        description: "Event window in days (0 = no limit)"
        default: "7"
  schedule:
    - cron: "10 6 * * *"  # 06:10 UTC

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  RESULTS_DIR: "data/value_bets"
  RESULTS_FILE: "team_line_beat_conservative.txt"
  MIN_DEC_PRICE: "${{ github.event.inputs.min_decimal_price || '1.20' }}"
  TEAM_WIN_MAX:  "${{ github.event.inputs.team_win_max || '3.50' }}"
  COMBO_MIN:     "${{ github.event.inputs.combo_min || '0.50' }}"
  WINDOW_DAYS:   "${{ github.event.inputs.window_days || '7' }}"
  BOOKMAKERS:    "Bet365"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Verify repo structure & secrets
        run: |
          test -n "${{ secrets.ODDS_API_KEY }}" || (echo "ODDS_API_KEY missing in repo secrets" >&2; exit 1)
          test -f "scripts/odds/value_bets_team_line_beat_conservative.py" || (echo "scripts/odds/value_bets_team_line_beat_conservative.py not found" >&2; exit 1)
          test -d "data/team_lines/by_league" || (echo "data/team_lines/by_league missing" >&2; exit 1)

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run — Team Line Beat (Conservative)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MIN_DEC_PRICE: ${{ env.MIN_DEC_PRICE }}
          TEAM_WIN_MAX:  ${{ env.TEAM_WIN_MAX }}
          COMBO_MIN:     ${{ env.COMBO_MIN }}
          WINDOW_DAYS:   ${{ env.WINDOW_DAYS }}
          BOOKMAKERS:    ${{ env.BOOKMAKERS }}
        run: |
          set -e
          mkdir -p "${RESULTS_DIR}"
          python scripts/odds/value_bets_team_line_beat_conservative.py | tee "${RESULTS_DIR}/${RESULTS_FILE}"
          {
            echo ""
            echo "Run timestamp (UTC): $(date -u +"%Y-%m-%d %H:%M:%S")"
            echo "Params: MIN_DEC_PRICE=${MIN_DEC_PRICE} TEAM_WIN_MAX=${TEAM_WIN_MAX} COMBO_MIN=${COMBO_MIN} WINDOW_DAYS=${WINDOW_DAYS} BOOKMAKERS=${BOOKMAKERS}"
          } >> "${RESULTS_DIR}/${RESULTS_FILE}"

      - uses: actions/upload-artifact@v4
        with:
          name: team-line-beat-conservative-${{ github.run_number }}
          path: ${{ env.RESULTS_DIR }}/${{ env.RESULTS_FILE }}
          if-no-files-found: error
          retention-days: 7

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${RESULTS_DIR}/${RESULTS_FILE}"
          git diff --cached --quiet || git commit -m "feat(odds): update team line beat (conservative) [skip ci]"
          git push || true