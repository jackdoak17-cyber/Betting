# .github/workflows/build-player-sot.yml
name: Player shots on target histories

on:
  workflow_dispatch: {}
  schedule:
    - cron: "8 6 * * *"   # ~07:08 London

concurrency:
  group: build-player-sot
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-sot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (full history for rebase)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build per-league SOT histories
        run: |
          # adjust if your builder script has a different name/args
          python scripts/build_player_sot.py
          echo "Time (UTC): $(date -u +"%Y-%m-%dT%H:%M:%S%z")"

      - name: Coverage / sanity checks
        run: |
          python scripts/check_player_sot_coverage.py

      - name: Commit & push (rebase + retry)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git config user.name  "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          # Stage only SOT outputs; add/adjust paths as needed
          git add \
            data/player_shots_on_target/by_league/*.json \
            data/player_shots_on_target/coverage.txt \
            data/player_shots_on_target/coverage.json \
            data/player_shots_on_target/summary_by_team.txt || true

          # Create commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          ts="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          git commit -m "chore(player_sot): update ${ts}"

          # Robust push: rebase on origin/main and retry
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}…"
            git fetch origin main
            git rebase origin/main || (echo "Rebase failed"; git rebase --abort; exit 1)
            if git push --force-with-lease origin HEAD:main; then
              echo "Pushed."
              break
            fi
            sleep $((attempt*3))
          done
