name: Player Stats V4 with Telegram (every 2.5h)

on:
  schedule:
    - cron: "10,40 9-20 * * *"  # 10 minutes after Bet365 odds fetch (09:10–20:40 UTC)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: player-stats-v4-telegram
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  MIN_DEC_PRICE: "1.72"  # Lower odds threshold for V4

jobs:
  player-stats-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Verify Telegram credentials
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "WARNING: TELEGRAM_BOT_TOKEN secret not set - notifications will be disabled"
          fi
          if [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "WARNING: TELEGRAM_CHAT_ID secret not set - notifications will be disabled"
          fi

      - name: Player stats V4 singles with Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_TELEGRAM: "1"
        run: |
          set -e
          mkdir -p "data/value_bets/V4 Bets/V4 player singles"
          python "scripts/value_bets/V4 Bets/V4 player singles/player_stats_v4.py"
          echo "\n---- tail: singles ----"
          tail -n 120 "data/value_bets/V4 Bets/V4 player singles/player_stats_v4.txt" || true

      - name: Upload artifacts (V4 outputs)
        uses: actions/upload-artifact@v4
        with:
          name: player-stats-v4-${{ github.run_number }}
          path: |
            data/value_bets/V4 Bets/V4 player singles/player_stats_v4.txt
            data/value_bets/V4 Bets/V4 player singles/notified_players.json
            data/value_bets/sheets/player_stats_v4_singles.csv
          if-no-files-found: warn
