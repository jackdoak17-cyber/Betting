name: Weekly Stats (fixtures, lineups, shots)

on:
  workflow_dispatch: {}
  schedule:
    # Every Monday 05:00 UTC — change to whatever you want
    - cron: "0 5 * * MON"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Debug tree
        run: |
          pwd; ls -la
          echo "---- scripts ----"; ls -la scripts || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          pip install --upgrade pip
          test -f requirements.txt && pip install -r requirements.txt || true

      - name: Sanity check secrets
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          [ -n "${SPORTMONKS_TOKEN:-}" ] || (echo "Missing SPORTMONKS_TOKEN" && exit 1)

      # Pull next 6 days of fixtures + predicted XIs and cache IDs
      - name: Fixtures + Lineups (next 6 days)
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          python scripts/fixtures_lineups.py

      # Compute shots series (last 10 / last 5) and write data/*.jsonl
      - name: Shots stats
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          python scripts/stats_shots.py

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data ]; then git add data; fi
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "ci(stats): update fixtures/lineups/shots ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
            git push
          fi
