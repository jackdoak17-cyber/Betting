name: Player SOT outside box histories

on:
  schedule:
    - cron: "0 8 * * 1"   # Every Monday at 08:00 UTC (after your 06:30 SOT, 07:00 fouls, 07:30 tackles)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-sot-outside-box:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: player-sot-outside-box
      cancel-in-progress: false
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      # Optional tuning (defaults in script: LAST_N=10, MIN_MINUTES=45)
      # PLAYER_SOT_OUTBOX_LAST_N: "10"
      # MIN_MINUTES: "45"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Build SOT outside box histories
        run: |
          python scripts/player_sot_outbox.py

      - name: Commit & push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player_sot_outbox
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(player_sot_outbox): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
