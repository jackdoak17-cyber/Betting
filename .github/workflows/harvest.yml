name: Shots & Odds Harvester

on:
  # run manually
  workflow_dispatch:
  # run every 2 hours (UTC)
  schedule:
    - cron: "0 */2 * * *"

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1) Pull fixtures + lineups for the next 6 days and store to data/
      - name: Fetch fixtures & lineups
        run: |
          python scripts/fixtures_lineups.py

      # 2) Build shots history & shortlists and store to data/
      - name: Compute shots stats & shortlists
        run: |
          python scripts/stats_shots.py

      # 3) Map shortlists to odds and write offers to data/
      - name: Query odds & produce offers
        run: |
          python scripts/shortlist_and_odds.py

      # 4) Upload the outputs as build artifacts so you can download them
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harvester-output
          path: |
            data/**
