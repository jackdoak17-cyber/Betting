name: Value bets — SOT certs (Sportmonks/Bet365)

on:
  schedule:
    - cron: "13 */6 * * *"   # every 6 hours at :13 UTC
  workflow_dispatch:
    inputs:
      min_decimal_price:
        description: "Minimum decimal price (>=)"
        default: "1.30"
      team_win_max:
        description: "Max Team ML allowed"
        default: "3.50"
      window_days:
        description: "Fixture window in days (0 = no limit)"
        default: "7"
      league_ids:
        description: "CSV league IDs (blank = auto from fixtures)"
        default: ""

permissions:
  contents: write

# Prevent concurrent runs from racing to push
concurrency:
  group: value-bets-sot-certs
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  RESULTS_DIR: "data/value_bets"
  RESULTS_FILE: "sot_certs.txt"
  MIN_DEC_PRICE: "${{ github.event.inputs.min_decimal_price || '1.30' }}"
  TEAM_WIN_MAX:  "${{ github.event.inputs.team_win_max || '3.50' }}"
  WINDOW_DAYS:   "${{ github.event.inputs.window_days || '7' }}"
  LEAGUE_IDS:    "${{ github.event.inputs.league_ids || '' }}"
  DEFAULT_BRANCH: "main"   # change if your default branch isn't main

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify inputs & files
        run: |
          test -f "scripts/value_bets/sot_certs.py" || (echo "scripts/value_bets/sot_certs.py not found" >&2; exit 1)
          test -d "data/fixtures" || (echo "data/fixtures missing" >&2; exit 1)
          test -d "data/player_shots_on_target/by_league" || (echo "SOT histories missing" >&2; exit 1)
          test -d "data/odds/b365" || (echo "Bet365 odds missing" >&2; exit 1)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run — SOT certs
        env:
          MIN_DEC_PRICE: ${{ env.MIN_DEC_PRICE }}
          TEAM_WIN_MAX:  ${{ env.TEAM_WIN_MAX }}
          WINDOW_DAYS:   ${{ env.WINDOW_DAYS }}
          LEAGUE_IDS:    ${{ env.LEAGUE_IDS }}
        run: |
          mkdir -p "${RESULTS_DIR}"
          python scripts/value_bets/sot_certs.py | tee "${RESULTS_DIR}/${RESULTS_FILE}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sot-certs-${{ github.run_number }}
          path: ${{ env.RESULTS_DIR }}/${{ env.RESULTS_FILE }}
          if-no-files-found: error
          retention-days: 7

      - name: Commit & push results (robust rebase)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          # Configure identity
          git config --global user.name  "${GIT_COMMITTER_NAME}"
          git config --global user.email "${GIT_COMMITTER_EMAIL}"

          # Base our working branch on latest remote
          git fetch origin "${DEFAULT_BRANCH}"
          git checkout -B "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}"

          # Stage the result file (include deletions just in case)
          git add -A "${RESULTS_DIR}/${RESULTS_FILE}"

          # Exit if nothing changed
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "chore(value-bets): possible_shot_certs update ${ts} [skip ci]"

          # Rebase onto latest and push with lease; retry a few times
          for attempt in 1 2 3; do
            git rebase --abort || true
            git pull --rebase --autostash origin "${DEFAULT_BRANCH}" || true
            if git push --force-with-lease origin "HEAD:${DEFAULT_BRANCH}"; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Push failed on attempt ${attempt} — retrying..."
            sleep 2
          done

          echo "Final attempt after fresh fetch..."
          git rebase --abort || true
          git fetch origin "${DEFAULT_BRANCH}"
          git pull --rebase --autostash origin "${DEFAULT_BRANCH}"
          git push --force-with-lease origin "HEAD:${DEFAULT_BRANCH}"
