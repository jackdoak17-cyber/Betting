name: Odds Scan (shots O0.5)

on:
  workflow_dispatch: {}
  schedule:
    # Mon/Wed/Fri at 08:00, 12:00, 16:00 UTC — tweak as you like
    - cron: "0 8,12,16 * * MON,WED,FRI"

permissions:
  contents: write

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Debug tree
        run: |
          pwd; ls -la
          echo "---- scripts ----"; ls -la scripts || true
          echo "---- data ----"; ls -la data || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          pip install --upgrade pip
          test -f requirements.txt && pip install -r requirements.txt || true

      - name: Sanity check secrets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          [ -n "${ODDS_API_KEY:-}" ] || (echo "Missing ODDS_API_KEY" && exit 1)

      # Read data/ from the stats job and produce shortlist + prices
      - name: Shortlist + Odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/shortlist_and_odds.py

      - name: Commit odds outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data ]; then git add data; fi
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "ci(odds): update shortlisted odds ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
            git push
          fi
