name: Build team series (team + opponent, with H/A)

on:
  schedule:
    - cron: "0 7 * * *"   # Daily at 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-team-series
  cancel-in-progress: false

jobs:
  build-team-series:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      TEAM_STATS_LAST_N: "10"
      TEAM_OPP_STATS_LAST_N: "10"
      INCLUDE_SECOND_YELLOW_IN_CARDS: "0"  # set "1" if you want 2nd yellows included in cards_total
      SERIES_MODE: "both"                  # both | team | opp
      PYTHONUNBUFFERED: "1"
      TEAM_STAT_OFFSIDES_ID: "51"         # <<< enable Offsides (type_id 51)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed so we can pull --rebase before pushing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Build team + opponent series (with home/away flags)
        run: |
          python scripts/build_team_series.py

      - name: Commit & push outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add both output trees
          git add data/team_stats data/team_opponent_stats

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(team_series): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          BRANCH="${GITHUB_REF_NAME:-main}"
          # Rebase in case the remote moved ahead during the run
          git pull --rebase origin "$BRANCH" || true
          git push origin HEAD:"$BRANCH"
