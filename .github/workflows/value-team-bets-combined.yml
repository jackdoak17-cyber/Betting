name: Value — Team Bets (Combined)

on:
  workflow_dispatch:
    inputs:
      run_target:
        description: Which selector(s) to run
        type: choice
        options:
          - all
          - corners
          - offsides
          - team_lines_over
        default: all
  schedule:
    # Corners: every 30 minutes
    - cron: "*/30 * * * *"
    # Team Lines OVER: daily at 07:55 UTC
    - cron: "55 7 * * *"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ------------------------------- TEAM LINES — OVER -------------------------------
  team_lines_over:
    # Run on manual (all or team_lines_over) OR when the 07:55 cron fires
    if: >
      ${{
        (github.event_name == 'workflow_dispatch' && (inputs.run_target == 'all' || inputs.run_target == 'team_lines_over')))
        || (github.event_name == 'schedule' && github.event.schedule == '55 7 * * *')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: value-team-bets:team-lines-over
      cancel-in-progress: true
    env:
      # Optional: restrict leagues (comma-separated). If unset, script auto-discovers.
      LEAGUE_IDS: "301,384,387,564,567,600,8,82,9"
      # Filters / thresholds (override as needed)
      MIN_DEC_PRICE: "1.20"
      TEAM_WIN_MAX: "3.50"
      WINDOW_DAYS: "7"
      COMBO_OVERALL_MIN: "0.70"
      SINGLE_OVERALL_MIN: "0.75"
      COMBO_SPLIT_MIN: "0.70"
      SINGLE_SPLIT_MIN: "0.75"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Team Lines — OVER selector
        run: |
          set -euo pipefail
          python scripts/value_bets/team_lines_over_ranked.py

      - name: Show summary
        run: |
          echo "----- data/value_bets/team_lines_over_ranked.txt -----"
          tail -n +1 data/value_bets/team_lines_over_ranked.txt || true
          echo "------------------------------------------------------"

      - name: Commit & push (rebase-safe)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git config --global user.name  "${GIT_COMMITTER_NAME}"
          git config --global user.email "${GIT_COMMITTER_EMAIL}"

          git fetch origin main
          git checkout -B main origin/main

          git add data/value_bets/team_lines_over_ranked.txt || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "chore(value-team-lines-over): update ${ts}"

          for attempt in 1 2 3; do
            git rebase --abort || true
            git pull --rebase --autostash origin main || true
            if git push --force-with-lease origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt — retrying..."
            sleep 2
          done

          echo "Final attempt after fresh fetch..."
          git rebase --abort || true
          git fetch origin main
          git pull --rebase --autostash origin main || true
          git push --force-with-lease origin HEAD:main

  # ------------------------------- CORNERS MATCH BET -------------------------------
  corners_match_bet:
    # Run on manual (all or corners) OR when the */30 cron fires
    if: >
      ${{
        (github.event_name == 'workflow_dispatch' && (inputs.run_target == 'all' || inputs.run_target == 'corners')))
        || (github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: value-team-bets:corners-match-bet
      cancel-in-progress: true
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      LEAGUE_IDS: "301,384,387,564,567,600,8,82,9"
      MIN_DEC_PRICE: "1.70"
      MIN_DIFF: "0.15"
      WINDOW_DAYS: "7"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run corners match bet
        run: |
          python scripts/value_bets/corners_match_bet.py

      - name: Commit & push report (if any)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/value_bets || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(value): update Corners Match Bet $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi

  # ------------------------------- OFFSIDES MATCH BET -------------------------------
  offsides_match_bet:
    # Manual only (all or offsides); never runs on schedule
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_target == 'all' || inputs.run_target == 'offsides') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: value-team-bets:offsides-match-bet
      cancel-in-progress: true
    env:
      WINDOW_DAYS: "7"
      MIN_DEC_PRICE: "1.70"
      MIN_COMBO: "0.50"
      MIN_ONE: "0.65"
      MIN_SAMPLE: "4"
      OUT_PATH: "data/value_bets/offsides_match_bet.txt"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps (none needed)
        run: echo "No external dependencies required."

      - name: Run Offsides value finder
        run: |
          python scripts/value_bets/offsides_match_bet.py
          echo "----- ${OUT_PATH} -----"
          cat "${OUT_PATH}" || true
          echo "-----------------------------------------"

      - name: Commit & push results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${OUT_PATH}"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(value): update Offsides Match Bet $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH" || true
          git push origin HEAD:"$BRANCH"
