name: Value — Team Bets (ALL)

on:
  schedule:
    # Run once per day at 08:10 UTC (after your 07:00 team-series build)
    - cron: "10 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: value-team-bets-daily
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      # -------------------- Team Lines — OVER --------------------
      - name: Run Team Lines — OVER selector
        env:
          # Optional: restrict leagues (comma-separated). If unset, script auto-discovers.
          LEAGUE_IDS: "301,384,387,564,567,600,8,82,9"
          # Filters / thresholds
          MIN_DEC_PRICE: "1.20"
          TEAM_WIN_MAX: "3.50"
          WINDOW_DAYS: "7"
          COMBO_OVERALL_MIN: "0.70"
          SINGLE_OVERALL_MIN: "0.75"
          COMBO_SPLIT_MIN: "0.70"
          SINGLE_SPLIT_MIN: "0.75"
        run: |
          set -euo pipefail
          python scripts/value_bets/team_lines_over_ranked.py
          echo "----- data/value_bets/team_lines_over_ranked.txt -----"
          tail -n +1 data/value_bets/team_lines_over_ranked.txt || true
          echo "------------------------------------------------------"

      # -------------------- Corners Match Bet --------------------
      - name: Run Corners Match Bet (Bet365)
        env:
          # Keep if any script internally fetches; otherwise harmless
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          LEAGUE_IDS: "301,384,387,564,567,600,8,82,9"
          MIN_DEC_PRICE: "1.70"
          MIN_DIFF: "0.15"
          WINDOW_DAYS: "7"
        run: |
          set -euo pipefail
          python scripts/value_bets/corners_match_bet.py
          echo "----- data/value_bets/corners_match_bet.txt -----"
          tail -n +1 data/value_bets/corners_match_bet.txt || true
          echo "-------------------------------------------------"

      # -------------------- Offsides Match Bet --------------------
      - name: Run Offsides Match Bet (Bet365)
        env:
          WINDOW_DAYS: "7"
          MIN_DEC_PRICE: "1.70"
          MIN_COMBO: "0.50"
          MIN_ONE: "0.65"
          MIN_SAMPLE: "4"
          OUT_PATH: "data/value_bets/offsides_match_bet.txt"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python scripts/value_bets/offsides_match_bet.py
          echo "----- data/value_bets/offsides_match_bet.txt -----"
          tail -n +1 data/value_bets/offsides_match_bet.txt || true
          echo "--------------------------------------------------"

      # -------------------- Commit & Push --------------------
      - name: Commit & push all reports (rebase-safe)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git config --global user.name  "${GIT_COMMITTER_NAME}"
          git config --global user.email "${GIT_COMMITTER_EMAIL}"

          git fetch origin main
          git checkout -B main origin/main

          git add data/value_bets/team_lines_over_ranked.txt \
                  data/value_bets/corners_match_bet.txt \
                  data/value_bets/offsides_match_bet.txt || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "chore(value-daily): update ${ts}"

          for attempt in 1 2 3; do
            git rebase --abort || true
            git pull --rebase --autostash origin main || true
            if git push --force-with-lease origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt — retrying..."
            sleep 2
          done

          echo "Final attempt after fresh fetch..."
          git rebase --abort || true
          git fetch origin main
          git pull --rebase --autostash origin main || true
          git push --force-with-lease origin HEAD:main
