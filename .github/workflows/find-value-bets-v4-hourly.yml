name: Find V4 Value Bets Daily (Fouls/Tackles)

on:
  schedule:
    # Run 5 minutes after scraper (which runs at 19:00)
    - cron: '5 19 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: find-value-bets-v4
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Analyze odds for value bets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_TELEGRAM: "1"
        run: |
          python scripts/odds_api/find_value_bets_v4.py

      - name: Commit and push results
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git config user.name "${GIT_COMMITTER_NAME}"
          git config user.email "${GIT_COMMITTER_EMAIL}"

          # Stage the value bets file and tracking file if they exist
          if [ -f "data/odds_api/value_bets_v4.json" ]; then
            git add "data/odds_api/value_bets_v4.json"
          fi
          if [ -f "data/odds_api/notified_bets_v4.json" ]; then
            git add "data/odds_api/notified_bets_v4.json"
          fi

          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git commit -m "chore(v4-value-bets): update analysis results ${ts}"

              # Push with rebase to handle concurrent runs
              BRANCH="${GITHUB_REF_NAME:-main}"
              for attempt in 1 2 3; do
                git pull --rebase origin "${BRANCH}" || true
                if git push origin HEAD:"${BRANCH}"; then
                  echo "✓ Value bets committed successfully (attempt ${attempt})"
                  exit 0
                fi
                echo "⚠ Push failed (attempt ${attempt}), retrying..."
                sleep 2
              done

            echo "✗ Failed to push value bets after 3 attempts"
            exit 1
          else
            echo "✓ No changes to value bets or tracking file"
          fi
