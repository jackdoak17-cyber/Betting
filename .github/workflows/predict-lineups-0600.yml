      - name: Predict lineups
        run: python scripts/predict_lineups.py --shards 3 --shard 0

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predict-lineups
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Predict lineups
        run: python scripts/predict_lineups.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predicted_xi
          git commit -m "chore(predicted_xi): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes"
          git push
