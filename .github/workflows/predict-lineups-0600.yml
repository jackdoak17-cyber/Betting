name: Predict lineups (Mon 06:00 UTC)

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: predict-lineups-0600
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Predict lineups
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          python scripts/predict_lineups.py --shards 3 --shard 0

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predicted_xi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(predicted_xi): shard 1/3 update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
