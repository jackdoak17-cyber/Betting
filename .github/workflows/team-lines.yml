name: Team hit lines

on:
  schedule:
    - cron: "45 7 * * 1"   # Mondays after team scripts
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  team_lines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEAM_LINES_USE_LAST_N: "10"   # change if you want fewer/more than last 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run builder
        run: |
          python scripts/build_fixture_team_lines.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/team_lines
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(team-lines): refresh $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
