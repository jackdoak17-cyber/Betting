name: Fetch lineups (from saved fixtures)

on:
  workflow_dispatch:

jobs:
  lineups:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: (Option A) Use fixtures from a previous run artifact
        # If you want to re-use latest artifact automatically, you can switch to actions/download-artifact@v4
        # For now, we assume fixtures_window.json is already in repo workspace (from a previous job in same run).
        run: |
          ls -la data || true
          test -f data/fixtures_window.json && echo "Found fixtures_window.json" || echo "Missing fixtures_window.json"

      - name: Run lineup fetcher
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: python scripts/fetch_lineups.py

      - name: Upload lineups
        uses: actions/upload-artifact@v4
        with:
          name: lineups
          path: |
            data/lineups_*.json
            data/lineups_*.csv
