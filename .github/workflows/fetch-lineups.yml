name: Fetch fixtures

on:
  workflow_dispatch:
  schedule:
    # run every day at 06:00 UTC (optional – remove if you only want manual runs)
    - cron: "0 6 * * *"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow the job to push the changed files
    env:
      # <-- make sure you create this secret in:
      # Repo Settings → Secrets and variables → Actions → New repository secret
      # Name: SPORTMONKS_API_TOKEN, Value: your Sportmonks v3 token
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
      # Optional: window length
      DAYS_AHEAD: "21"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetcher
        run: python scripts/fetch_fixtures.py

      - name: Commit results (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/fixtures
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(fixtures): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
