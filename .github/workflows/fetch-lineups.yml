name: Fetch lineups (EPL + Championship + La Liga)

on:
  workflow_dispatch:

jobs:
  lineups:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure fixtures exist
        run: |
          ls -la data || true
          test -f data/fixtures_window.json || (echo "Missing fixtures_window.json. Run the fixtures workflow first." && exit 1)

      - name: Run lineup fetcher (3 leagues)
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          LEAGUE_IDS: "8,9,564"   # EPL, Championship, La Liga
          LINEUPS_SLEEP: "0.7"
        run: python scripts/fetch_lineups.py

      - name: Upload lineups
        uses: actions/upload-artifact@v4
        with:
          name: lineups-8-9-564
          path: |
            data/lineups_*.json
            data/lineups_*.csv
