name: Value — Team Lines OVER

on:
  schedule:
    # Daily after your team/opponent scripts have updated local data (UTC)
    - cron: "55 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: value-team-lines-over
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Optional: restrict leagues (comma-separated). If unset, script auto-discovers.
  LEAGUE_IDS: "301,384,387,564,567,600,8,82,9"
  # Filters / thresholds (override as needed)
  MIN_DEC_PRICE: "1.20"
  TEAM_WIN_MAX: "3.50"
  WINDOW_DAYS: "7"
  COMBO_OVERALL_MIN: "0.70"
  SINGLE_OVERALL_MIN: "0.75"
  COMBO_SPLIT_MIN: "0.70"
  SINGLE_SPLIT_MIN: "0.75"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Team Lines — OVER selector
        env:
          LEAGUE_IDS: ${{ env.LEAGUE_IDS }}
          MIN_DEC_PRICE: ${{ env.MIN_DEC_PRICE }}
          TEAM_WIN_MAX: ${{ env.TEAM_WIN_MAX }}
          WINDOW_DAYS: ${{ env.WINDOW_DAYS }}
          COMBO_OVERALL_MIN: ${{ env.COMBO_OVERALL_MIN }}
          SINGLE_OVERALL_MIN: ${{ env.SINGLE_OVERALL_MIN }}
          COMBO_SPLIT_MIN: ${{ env.COMBO_SPLIT_MIN }}
          SINGLE_SPLIT_MIN: ${{ env.SINGLE_SPLIT_MIN }}
        run: |
          set -euo pipefail
          python scripts/value_bets/team_lines_over_ranked.py

      - name: Show summary
        run: |
          echo "----- data/value_bets/team_lines_over_ranked.txt -----"
          tail -n +1 data/value_bets/team_lines_over_ranked.txt || true
          echo "------------------------------------------------------"

      - name: Commit & push (rebase-safe)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git config --global user.name  "${GIT_COMMITTER_NAME}"
          git config --global user.email "${GIT_COMMITTER_EMAIL}"

          # Base branch on latest remote main
          git fetch origin main
          git checkout -B main origin/main

          git add data/value_bets/team_lines_over_ranked.txt || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "chore(value-team-lines-over): update ${ts}"

          # Rebase & push with a couple retries
          for attempt in 1 2 3; do
            git rebase --abort || true
            git pull --rebase --autostash origin main || true
            if git push --force-with-lease origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt — retrying..."
            sleep 2
          done

          echo "Final attempt after fresh fetch..."
          git rebase --abort || true
          git fetch origin main
          git pull --rebase --autostash origin main || true
          git push --force-with-lease origin HEAD:main
