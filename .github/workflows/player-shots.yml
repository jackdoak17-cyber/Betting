name: Player shots (current season, league-only, ≥45')

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # Every Monday at 07:00 UTC

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: player-shots-weekly
      cancel-in-progress: false
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run player-shots
        run: python scripts/player_shots.py

      - name: Render team summary
        run: python scripts/render_player_shots_summary.py

      - name: Coverage check vs predicted XIs
        run: python scripts/check_player_shots_coverage.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player_shots
          git commit -m "chore(player_shots): weekly update $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes"
          # Rebase on any remote changes to avoid non-fast-forward errors
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
