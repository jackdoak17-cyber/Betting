name: Player shots (current season, league-only, ≥45')

on:
  schedule:
    - cron: "0 7 * * 1"   # Every Monday 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: player-shots-weekly
      cancel-in-progress: false
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Build player shot histories
        run: |
          python scripts/player_shots.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player_shots
          git commit -m "chore(player_shots): weekly update $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes"
          git push
