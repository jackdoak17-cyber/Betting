name: Criteria odds flags (Sportmonks • Bet365)

on:
  # Run every day ~08:20 Europe/London.
  # NOTE: GitHub cron is UTC. 08:20 London ≈ 07:20 UTC while BST is active.
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:
    inputs:
      min_price:
        description: "Minimum price threshold"
        required: false
        default: "1.80"
      bookmaker_id:
        description: "Bet365 bookmaker id (usually 2)"
        required: false
        default: "2"

# Prevent overlapping runs
concurrency:
  group: criteria-odds-sportmonks
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  flag:
    name: Flag player odds from criteria (Bet365)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # —— Required secret ——
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      # —— Optional overrides via manual dispatch ——
      MIN_PRICE: ${{ github.event.inputs.min_price || '1.80' }}
      BET365_BOOKMAKER_ID: ${{ github.event.inputs.bookmaker_id || '2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # (Optional) quick sanity check for expected inputs
      - name: Check criteria + predicted_xi inputs exist
        run: |
          test -e data/player_filters/players_by_criteria.json -o -e data/player_filters/players_by_criteria.txt
          test -d data/predicted_xi/by_league

      - name: Run Sportmonks odds flagger (Bet365)
        run: python scripts/flag_players_by_criteria_sportmonks.py

      - name: Show output (for logs)
        run: |
          echo "------- criteria_odds_flags.txt -------"
          sed -n '1,120p' data/player_filters/criteria_odds_flags.txt || true
          echo "---------------------------------------"

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player_filters/criteria_odds_flags.txt
          git commit -m "feat(criteria-odds-sm): refresh $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes to commit"
          git push
