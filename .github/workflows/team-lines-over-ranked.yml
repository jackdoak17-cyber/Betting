name: Value bets — Team Lines OVER (Sportmonks)

on:
  schedule:
    # Every 6 hours at :12 UTC (stagger away from your other jobs)
    - cron: "12 */6 * * *"
  workflow_dispatch:
    inputs:
      league_ids:
        description: "CSV of league IDs to scan (blank = auto-discover from data/fixtures)"
        required: false
        default: ""
      min_decimal_price:
        description: "Minimum decimal price to include"
        required: false
        default: "1.20"
      window_days:
        description: "Restrict fixtures to the next N days (0 = no limit)"
        required: false
        default: "7"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  RESULTS_DIR: "data/value_bets"
  RESULTS_FILE: "team_lines_over_ranked.txt"
  # Defaults; workflow_dispatch can override via inputs above
  LEAGUE_IDS:     "${{ github.event.inputs.league_ids || '' }}"
  MIN_DEC_PRICE:  "${{ github.event.inputs.min_decimal_price || '1.20' }}"
  WINDOW_DAYS:    "${{ github.event.inputs.window_days || '7' }}"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repo structure
        run: |
          test -f "scripts/value_bets/team_lines_over_ranked.py" || (echo "scripts/value_bets/team_lines_over_ranked.py not found" >&2; exit 1)
          test -d "data/fixtures" || (echo "data/fixtures missing" >&2; exit 1)
          test -d "data/team_stats/by_league" || (echo "data/team_stats/by_league missing" >&2; exit 1)
          test -d "data/team_opponent_stats/by_league" || (echo "data/team_opponent_stats/by_league missing" >&2; exit 1)
          test -d "data/odds/b365" || (echo "data/odds/b365 missing" >&2; exit 1)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # No external deps needed; script reads local JSON only

      - name: Run — Team Lines OVER (ranked)
        env:
          LEAGUE_IDS:    ${{ env.LEAGUE_IDS }}
          MIN_DEC_PRICE: ${{ env.MIN_DEC_PRICE }}
          WINDOW_DAYS:   ${{ env.WINDOW_DAYS }}
        run: |
          set -e
          mkdir -p "${RESULTS_DIR}"
          python scripts/value_bets/team_lines_over_ranked.py | tee "${RESULTS_DIR}/${RESULTS_FILE}"
          {
            echo ""
            echo "Run timestamp (UTC): $(date -u +"%Y-%m-%d %H:%M:%S")"
            echo "Params: LEAGUE_IDS='${LEAGUE_IDS}' MIN_DEC_PRICE=${MIN_DEC_PRICE} WINDOW_DAYS=${WINDOW_DAYS}"
          } >> "${RESULTS_DIR}/${RESULTS_FILE}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-lines-over-ranked-${{ github.run_number }}
          path: ${{ env.RESULTS_DIR }}/${{ env.RESULTS_FILE }}
          if-no-files-found: error
          retention-days: 7

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${RESULTS_DIR}/${RESULTS_FILE}"
          git diff --cached --quiet || git commit -m "feat(value-bets): update team lines OVER (ranked) [skip ci]"
          git push || true
